<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Tank Arcade</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030305;
            font-family: 'VT323', monospace;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 850px;
            max-height: 480px;
            background: #090a0f;
            display: flex;
            flex-direction: row;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.25);
            overflow: hidden;
            border: 2px solid #1f293d;
        }
        
        /* Area Game / Canvas di Tengah */
        .game-main {
            position: relative;
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0d1117;
        }
        canvas {
            display: block;
            width: 100%;
            flex-grow: 1;
        }
        
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            background: rgba(13, 17, 23, 0.75);
            border-bottom: 1px solid #1f293d;
        }
        .header-hud {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
            display: flex;
            gap: 20px;
        }
        .status-hud {
            font-size: 18px;
            display: flex;
            gap: 20px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
        }

        /* Panel Kontrol Analog & Tombol Fire Khusus Mobile Landscape */
        .mobile-panel-left, .mobile-panel-right {
            display: none; /* Default tersembunyi, muncul otomatis jika di HP */
            width: 150px;
            height: 100%;
            background: rgba(3, 3, 5, 0.9);
            align-items: center;
            justify-content: center;
            z-index: 10;
            flex-shrink: 0;
        }
        .mobile-panel-left {
            border-right: 2px solid #1f293d;
        }
        .mobile-panel-right {
            border-left: 2px solid #1f293d;
        }

        /* Virtual Analog Joystick (Gaya MLBB) */
        #joystick-base {
            width: 110px;
            height: 110px;
            background: rgba(13, 17, 23, 0.6);
            border: 2px solid rgba(0, 255, 204, 0.4);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        #joystick-thumb {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 204, 0.7);
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 30px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            pointer-events: none;
        }

        /* Tombol Fire Besar */
        .fire-btn-mobile {
            width: 90px;
            height: 90px;
            background: #ff007f;
            border: 2px solid #ff3399;
            color: #ffffff;
            font-family: 'VT323', monospace;
            font-size: 26px;
            font-weight: bold;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fire-btn-mobile:active {
            background: #cc0066;
            transform: scale(0.95);
        }

        /* Layar Notifikasi Rotasi Khusus HP Portrait */
        #rotateNotice {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #030305;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
        }
        #rotateNotice h2 {
            color: #ff007f;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,0,127,0.6);
        }
        #rotateNotice p {
            color: #00ffcc;
            font-size: 18px;
            line-height: 1.4;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 5, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }
        h1 {
            font-size: 54px;
            margin-bottom: 5px;
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
            letter-spacing: 3px;
        }
        p {
            color: #00ffcc;
            font-size: 19px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            line-height: 1.4;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.4);
        }
        .btn {
            background: #00ffcc;
            color: #030305;
            border: none;
            padding: 10px 35px;
            font-family: 'VT323', monospace;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: all 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #ffffff;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Layar Peringatan Putar HP ke Horizontal -->
    <div id="rotateNotice">
        <h2>🔄 PLEASE ROTATE YOUR DEVICE</h2>
        <p>For the best arcade experience, please rotate your smartphone to <b>Landscape</b> mode.</p>
    </div>

    <div id="game-container">
        <!-- Panel Kontrol Kiri: Virtual Analog (Hanya Muncul di HP) -->
        <div id="mobileLeft" class="mobile-panel-left">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
            </div>
        </div>

        <!-- Area Utama Game (Horizontal untuk Laptop & HP) -->
        <div class="game-main">
            <!-- HUD Layer -->
            <div class="ui-layer">
                <div class="header-hud">
                    <span id="scoreDisplay">SCORE: 0000</span>
                    <span id="waveDisplay" style="color: #ff007f;">WAVE 1</span>
                </div>
                <div class="status-hud">
                    <span id="livesDisplay">LIVES: 3 💚</span>
                    <span id="enemiesLeft">ENEMIES: 10</span>
                </div>
            </div>

            <!-- Canvas Game -->
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Panel Kontrol Kanan: Tombol Fire (Hanya Muncul di HP) -->
        <div id="mobileRight" class="mobile-panel-right">
            <button class="fire-btn-mobile" id="fireBtn">FIRE</button>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="screen">
            <h1>CYBER TANK</h1>
            <p id="guideText">Protect the Base • Destroy Enemy Tanks</p>
            <button class="btn" onclick="startGame()">START BATTLE</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: #ff3333; text-shadow: 0 0 15px rgba(255,51,51,0.7);">GAME OVER</h1>
            <p id="finalScoreText" style="color: #8b949e;">BASE DESTROYED OR LIVES LOST</p>
            <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = document.querySelector('.game-main').clientWidth;
            canvas.height = document.querySelector('.game-main').clientHeight - document.querySelector('.ui-layer').offsetHeight;
        }

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        // Pengaturan Tampilan Berdasarkan Perangkat
        function checkDeviceLayout() {
            if (isTouchDevice) {
                // Jika di HP, wajibkan orientasi landscape
                if (window.innerHeight > window.innerWidth) {
                    document.getElementById('rotateNotice').style.display = 'flex';
                } else {
                    document.getElementById('rotateNotice').style.display = 'none';
                    document.getElementById('mobileLeft').style.display = 'flex';
                    document.getElementById('mobileRight').style.display = 'flex';
                    document.getElementById('guideTextinnerHTML') = "Defend the Base • Use Left Analog & Right Fire Button";
                }
            } else {
                // Jika di Laptop: Tampilan horizontal penuh tanpa panel analog/fire
                document.getElementById('rotateNotice').style.display = 'none';
                document.getElementById('mobileLeft').style.display = 'none';
                document.getElementById('mobileRight').style.display = 'none';
                document.getElementById('guideText').innerHTML = "Defend the Base • Destroy Enemy Tanks<br><span style='color:#ffb86c; font-size:17px;'>Move: WASD / Arrow Keys &nbsp;|&nbsp; Shoot: Spacebar</span>";
            }
            resizeCanvas();
        }

        window.addEventListener('resize', checkDeviceLayout);
        window.addEventListener('orientationchange', checkDeviceLayout);
        checkDeviceLayout();

        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startBGM();
        }

        function startBGM() {
            if (bgmInterval) return;
            const bassNotes = [110, 123.47, 130.81, 146.83];
            let step = 0;

            bgmInterval = setInterval(() => {
                if (!isPlaying || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(bassNotes[step % bassNotes.length], audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                    step++;
                } catch(e) {}
            }, 300);
        }

        function stopAudio() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === "shoot") {
                    osc.type = "square";
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === "explode") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === "wave_clear") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.6);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {}
        }

        let isPlaying = false;
        let score = 0;
        let lives = 3;
        let wave = 1;
        let enemiesRemaining = 10;
        let baseDestroyed = false;

        let player = {
            x: 0, y: 0,
            size: 30,
            speed: 2.5,
            dir: 'UP'
        };

        let base = { x: 0, y: 0, size: 30, alive: true };
        let bullets = [];
        let enemies = [];
        let walls = [];
        let particles = [];
        let enemySpawnTimer = 0;

        // --- Logika Virtual Analog Joystick (Mobile) ---
        let joystickVector = { x: 0, y: 0 };
        let joystickActive = false;
        const joystickBase = document.getElementById('joystick-base');
        const joystickThumb = document.getElementById('joystick-thumb');

        joystickBase.addEventListener('touchstart', handleJoystickStart);
        joystickBase.addEventListener('touchmove', handleJoystickMove);
        joystickBase.addEventListener('touchend', handleJoystickEnd);

        function handleJoystickStart(e) {
            joystickActive = true;
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            if (!joystickActive) return;
            let touch = e.touches[0];
            let rect = joystickBase.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let maxRadius = 35;

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
                distance = maxRadius;
            }

            joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector.x = dx / maxRadius;
            joystickVector.y = dy / maxRadius;
        }

        function handleJoystickEnd() {
            joystickActive = false;
            joystickThumb.style.transform = `translate(0px, 0px)`;
            joystickVector.x = 0;
            joystickVector.y = 0;
        }

        document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            playerFire();
        });

        // Kontrol Keyboard Laptop
        let keys = {};
        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            keys[e.code] = true;
            if (e.code === 'Space') {
                playerFire();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function playerFire() {
            if (!isPlaying) return;
            let playerBullets = bullets.filter(b => b.isPlayer);
            if (playerBullets.length < 2) {
                playSound("shoot");
                let bx = player.x + player.size / 2 - 3;
                let by = player.y + player.size / 2 - 3;
                let vx = 0, vy = 0;
                let speed = 6;

                if (player.dir === 'UP') vy = -speed;
                else if (player.dir === 'DOWN') vy = speed;
                else if (player.dir === 'LEFT') vx = -speed;
                else if (player.dir === 'RIGHT') vx = speed;

                bullets.push({ x: bx, y: by, vx: vx, vy: vy, size: 6, isPlayer: true });
            }
        }

        function initLevel() {
            resizeCanvas();
            player.x = canvas.width / 2 - 50;
            player.y = canvas.height - 60;
            player.dir = 'UP';

            base.x = canvas.width / 2 - 15;
            base.y = canvas.height - 35;
            base.alive = true;
            baseDestroyed = false;

            bullets = [];
            enemies = [];
            particles = [];
            enemiesRemaining = 8 + (wave * 2);

            walls = [];
            let cols = Math.floor(canvas.width / 45);
            for (let r = 1; r < 4; r++) {
                for (let c = 1; c < cols - 1; c++) {
                    if (c !== Math.floor(cols / 2) && Math.random() > 0.4) {
                        walls.push({ x: c * 45, y: r * 45, w: 40, h: 16 });
                    }
                }
            }
        }

        function startGame() {
            initAudio();
            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            
            score = 0;
            lives = 3;
            wave = 1;
            isPlaying = true;
            initLevel();
            loop();
        }

        function gameOver() {
            isPlaying = false;
            stopAudio();
            playSound("gameover");
            document.getElementById("gameOverScreen").classList.remove("hidden");
        }

        function spawnEnemy() {
            if (enemies.length < 3 + Math.floor(wave/2) && enemiesRemaining > 0) {
                let spawnX = Math.random() > 0.5 ? 20 : canvas.width - 50;
                enemies.push({
                    x: spawnX,
                    y: 20,
                    size: 30,
                    speed: 1.1 + (wave * 0.12),
                    dir: 'DOWN',
                    shootTimer: 0
                });
                enemiesRemaining--;
            }
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function update() {
            if (!isPlaying) return;

            let nextX = player.x;
            let nextY = player.y;

            // Gerakan Keyboard Laptop
            if (keys['KeyW'] || keys['ArrowUp']) {
                player.dir = 'UP'; nextY -= player.speed;
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                player.dir = 'DOWN'; nextY += player.speed;
            } else if (keys['KeyA'] || keys['ArrowLeft']) {
                player.dir = 'LEFT'; nextX -= player.speed;
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                player.dir = 'RIGHT'; nextX += player.speed;
            } 
            // Gerakan Virtual Analog HP (Landscape)
            else if (joystickActive) {
                nextX += joystickVector.x * player.speed;
                nextY += joystickVector.y * player.speed;

                if (Math.abs(joystickVector.x) > Math.abs(joystickVector.y)) {
                    player.dir = joystickVector.x > 0 ? 'RIGHT' : 'LEFT';
                } else {
                    player.dir = joystickVector.y > 0 ? 'DOWN' : 'UP';
                }
            }

            if (nextX >= 10 && nextX + player.size <= canvas.width - 10 &&
                nextY >= 10 && nextY + player.size <= canvas.height - 10) {
                player.x = nextX;
                player.y = nextY;
            }

            enemySpawnTimer++;
            if (enemySpawnTimer % 90 === 0) {
                spawnEnemy();
            }

            for (let en of enemies) {
                if (Math.random() < 0.03) {
                    let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                    en.dir = dirs[Math.floor(Math.random() * dirs.length)];
                }

                let evx = 0, evy = 0;
                if (en.dir === 'UP') evy = -en.speed;
                else if (en.dir === 'DOWN') evy = en.speed;
                else if (en.dir === 'LEFT') evx = -en.speed;
                else if (en.dir === 'RIGHT') evx = en.speed;

                en.x += evx;
                en.y += evy;

                if (en.x < 10 || en.x + en.size > canvas.width - 10) en.x -= evx;
                if (en.y < 10 || en.y + en.size > canvas.height - 10) en.y -= evy;

                en.shootTimer++;
                if (en.shootTimer > 80) {
                    en.shootTimer = 0;
                    let ebx = en.x + en.size / 2 - 3;
                    let eteby = en.y + en.size / 2 - 3;
                    let bvx = 0, bvy = 0;
                    let bspeed = 4;
                    if (en.dir === 'UP') bvy = -bspeed;
                    else if (en.dir === 'DOWN') bvy = bspeed;
                    else if (en.dir === 'LEFT') bvx = -bspeed;
                    else if (en.dir === 'RIGHT') bvx = bspeed;

                    bullets.push({ x: ebx, y: eteby, vx: bvx, vy: bvy, size: 6, isPlayer: false });
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                let hitWall = false;
                for (let w = walls.length - 1; w >= 0; w--) {
                    let wall = walls[w];
                    if (b.x < wall.x + wall.w && b.x + b.size > wall.x &&
                        b.y < wall.y + wall.h && b.y + b.size > wall.y) {
                        walls.splice(w, 1);
                        hitWall = true;
                        createParticles(wall.x + wall.w/2, wall.y + wall.h/2, "#ffb86c", 6);
                        break;
                    }
                }
                if (hitWall) {
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.isPlayer) {
                    let hitEnemy = false;
                    for (let e = enemies.length - 1; e >= 0; e--) {
                        let en = enemies[e];
                        if (b.x < en.x + en.size && b.x + b.size > en.x &&
                            b.y < en.y + en.size && b.y + b.size > en.y) {
                            enemies.splice(e, 1);
                            hitEnemy = true;
                            score += 100;
                            playSound("explode");
                            createParticles(en.x + en.size/2, en.y + en.size/2, "#ff007f", 16);
                            
                            if (enemies.length === 0 && enemiesRemaining === 0) {
                                wave++;
                                playSound("wave_clear");
                                initLevel();
                            }
                            break;
                        }
                    }
                    if (hitEnemy) {
                        bullets.splice(i, 1);
                        continue;
                    }
                } else {
                    if (b.x < player.x + player.size && b.x + b.size > player.x &&
                        b.y < player.y + player.size && b.y + b.size > player.y) {
                        lives--;
                        playSound("explode");
                        createParticles(player.x + player.size/2, player.y + player.size/2, "#00ffcc", 20);
                        bullets.splice(i, 1);
                        if (lives <= 0) {
                            gameOver();
                            return;
                        } else {
                            player.x = canvas.width / 2 - 50;
                            player.y = canvas.height - 60;
                        }
                        continue;
                    }

                    if (base.alive && b.x < base.x + base.size && b.x + b.size > base.x &&
                        b.y < base.y + base.size && b.y + b.size > base.y) {
                        base.alive = false;
                        baseDestroyed = true;
                        playSound("explode");
                        createParticles(base.x + base.size/2, base.y + base.size/2, "#ff3333", 30);
                        gameOver();
                        return;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawTank(x, y, size, dir, color, isPlayer) {
            ctx.save();
            ctx.translate(x + size / 2, y + size / 2);

            let angle = 0;
            if (dir === 'DOWN') angle = Math.PI;
            else if (dir === 'LEFT') angle = -Math.PI / 2;
            else if (dir === 'RIGHT') angle = Math.PI / 2;
            ctx.rotate(angle);

            ctx.fillStyle = "#161b22";
            ctx.fillRect(-size/2, -size/2, 6, size);
            ctx.fillRect(size/2 - 6, -size/2, 6, size);

            ctx.fillStyle = color;
            ctx.fillRect(-size/2 + 6, -size/2 + 3, size - 12, size - 6);

            ctx.fillStyle = isPlayer ? "#ffffff" : "#ff3333";
            ctx.fillRect(-3, -size/2 - 8, 6, 16);

            ctx.fillStyle = "#090a0f";
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#161b22";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            for (let wall of walls) {
                ctx.fillStyle = "#ffb86c";
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeStyle = "#0d1117";
                ctx.lineWidth = 1;
                ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            }

            if (base.alive) {
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(base.x, base.y, base.size, base.size);
                ctx.fillStyle = "#ff007f";
                ctx.fillRect(base.x + 5, base.y + 5, base.size - 10, base.size - 10);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px 'VT323', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("BASE", base.x + base.size/2, base.y + base.size/2);
            }

            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawTank(player.x, player.y, player.size, player.dir, "#00ffcc", true);

            for (let en of enemies) {
                drawTank(en.x, en.y, en.size, en.dir, "#ff0066", false);
            }

            for (let b of bullets) {
                ctx.fillStyle = b.isPlayer ? "#ffff00" : "#ff3333";
                ctx.fillRect(b.x, b.y, b.size, b.size);
            }

            ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
            for (let sy = 0; sy < canvas.height; sy += 4) {
                ctx.fillRect(0, sy, canvas.width, 1);
            }

            document.getElementById("scoreDisplay").innerText = `SCORE: ${Math.floor(score).toString().padStart(4, '0')}`;
            document.getElementById("waveDisplay").innerText = `WAVE ${wave}`;
            document.getElementById("livesDisplay").innerText = `LIVES: ${lives} 💚`;
            document.getElementById("enemiesLeft").innerText = `ENEMIES: ${enemiesRemaining + enemies.length}`;
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
