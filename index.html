        /* =========================================================
           SMOOTH MOVEMENT
           ========================================================= */

        function updatePlayerMovement() {

            let inputX = 0;

            let inputY = 0;


            /*
             * Keyboard.
             */

            if (
                keys["KeyA"] ||
                keys["ArrowLeft"]
            ) {
                inputX -= 1;
            }

            if (
                keys["KeyD"] ||
                keys["ArrowRight"]
            ) {
                inputX += 1;
            }

            if (
                keys["KeyW"] ||
                keys["ArrowUp"]
            ) {
                inputY -= 1;
            }

            if (
                keys["KeyS"] ||
                keys["ArrowDown"]
            ) {
                inputY += 1;
            }


            /*
             * Joystick mengambil alih apabila aktif.
             */

            if (joystickActive) {

                inputX =
                    joystickVector.x;

                inputY =
                    joystickVector.y;
            }


            /*
             * Normalize keyboard diagonal movement.
             */

            const inputLength =
                Math.hypot(
                    inputX,
                    inputY
                );


            if (
                inputLength > 1 &&
                !joystickActive
            ) {

                inputX /=
                    inputLength;

                inputY /=
                    inputLength;
            }


            /*
             * Direction mengikuti arah input.
             */

            const deadZone = 0.16;


            if (
                Math.abs(inputX) >
                Math.abs(inputY) &&
                Math.abs(inputX) >
                deadZone
            ) {

                player.dir =
                    inputX > 0
                        ? "RIGHT"
                        : "LEFT";

            } else if (
                Math.abs(inputY) >
                deadZone
            ) {

                player.dir =
                    inputY > 0
                        ? "DOWN"
                        : "UP";
            }


            /*
             * Target velocity.
             */

            const joystickMultiplier =
                joystickActive
                    ? 1.12
                    : 1;


            const targetVX =
                inputX *
                player.maxSpeed *
                joystickMultiplier;


            const targetVY =
                inputY *
                player.maxSpeed *
                joystickMultiplier;


            /*
             * Acceleration.
             */

            player.vx +=
                (targetVX - player.vx) *
                player.acceleration *
                0.16;


            player.vy +=
                (targetVY - player.vy) *
                player.acceleration *
                0.16;


            /*
             * Saat input dilepas, friction membuat tank
             * berhenti secara halus.
             */

            if (
                Math.abs(inputX) <
                deadZone
            ) {

                player.vx *=
                    player.friction;
            }


            if (
                Math.abs(inputY) <
                deadZone
            ) {

                player.vy *=
                    player.friction;
            }


            /*
             * Stop velocity yang sangat kecil.
             */

            if (
                Math.abs(player.vx) <
                0.03
            ) {
                player.vx = 0;
            }

            if (
                Math.abs(player.vy) <
                0.03
            ) {
                player.vy = 0;
            }


            /*
             * Apply movement.
             */

            let nextX =
                player.x +
                player.vx;

            let nextY =
                player.y +
                player.vy;


            const arenaLeft = 20;

            const arenaRight =
                canvas.clientWidth -
                20;

            const arenaTop = 60;

            const arenaBottom =
                canvas.clientHeight -
                20;


            /*
             * Clamp position.
             */

            if (
                nextX <
                arenaLeft
            ) {

                nextX =
                    arenaLeft;

                player.vx *= -0.15;
            }


            if (
                nextX +
                player.size >
                arenaRight
            ) {

                nextX =
                    arenaRight -
                    player.size;

                player.vx *= -0.15;
            }


            if (
                nextY <
                arenaTop
            ) {

                nextY =
                    arenaTop;

                player.vy *= -0.15;
            }


            if (
                nextY +
                player.size >
                arenaBottom
            ) {

                nextY =
                    arenaBottom -
                    player.size;

                player.vy *= -0.15;
            }


            player.x = nextX;

            player.y = nextY;
        }


        /* =========================================================
           FIRE
           ========================================================= */

        function playerFire() {

            if (
                !isPlaying ||
                player.fireCooldown > 0
            ) {
                return;
            }


            const playerBulletCount =
                bullets.filter(
                    bullet =>
                        bullet.isPlayer
                ).length;


            const isBazooka =
                player.activePowerup ===
                "bazooka";


            const bulletLimit =
                isBazooka
                    ? 3
                    : 4;


            if (
                playerBulletCount >=
                bulletLimit
            ) {
                return;
            }


            const speed =
                isBazooka
                    ? 9.5
                    : 12;


            const size =
                isBazooka
                    ? 14
                    : 7;


            let vx = 0;

            let vy = 0;


            if (player.dir === "UP") {
                vy = -speed;
            }

            else if (
                player.dir === "DOWN"
            ) {
                vy = speed;
            }

            else if (
                player.dir === "LEFT"
            ) {
                vx = -speed;
            }

            else if (
                player.dir === "RIGHT"
            ) {
                vx = speed;
            }


            const bx =
                player.x +
                player.size / 2 -
                size / 2;


            const by =
                player.y +
                player.size / 2 -
                size / 2;


            bullets.push({

                x: bx,

                y: by,

                vx: vx,

                vy: vy,

                size: size,

                isPlayer: true,

                isBazooka: isBazooka,

                life: 100
            });


            player.fireCooldown =
                isBazooka
                    ? 18
                    : 11;


            muzzleFlashes.push({

                x:
                    player.x +
                    player.size / 2 +
                    vx * 0.8,

                y:
                    player.y +
                    player.size / 2 +
                    vy * 0.8,

                life: 8,

                maxLife: 8,

                color:
                    isBazooka
                        ? "#38bdf8"
                        : "#facc15"
            });


            createParticles(

                player.x +
                player.size / 2 +
                vx * 0.5,

                player.y +
                player.size / 2 +
                vy * 0.5,

                isBazooka
                    ? "#38bdf8"
                    : "#facc15",

                isBazooka ? 7 : 4
            );


            playSound(
                isBazooka
                    ? "bazooka"
                    : "shoot"
            );
        }


        /* =========================================================
           ENEMY SPAWN
           ========================================================= */

        function spawnEnemy() {

            const maxEnemies =
                3 +
                Math.floor(
                    level / 2
                );


            if (
                enemies.length >=
                maxEnemies ||
                enemiesRemaining <= 0
            ) {
                return;
            }


            const side =
                Math.random() < 0.5
                    ? "left"
                    : "right";


            const size = 36;


            const spawnX =
                side === "left"
                    ? 30
                    : canvas.clientWidth -
                      size -
                      30;


            const colors = [
                "#ff0066",
                "#ff1744",
                "#d946ef",
                "#fb7185"
            ];


            enemies.push({

                x: spawnX,

                y: 70,

                size: size,

                speed:
                    1.15 +
                    level * 0.10 +
                    Math.random() * 0.35,

                dir: "DOWN",

                shootTimer:
                    Math.floor(
                        Math.random() * 45
                    ),

                changeTimer:
                    Math.floor(
                        Math.random() * 90
                    ),

                color:
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ],

                wobble:
                    Math.random() *
                    Math.PI *
                    2
            });


            enemiesRemaining--;
        }


        /* =========================================================
           ENEMY AI
           ========================================================= */

        function updateEnemies() {

            for (
                const enemy
                of enemies
            ) {

                enemy.changeTimer--;


                /*
                 * Enemy sesekali mengubah arah.
                 */

                if (
                    enemy.changeTimer <= 0
                ) {

                    enemy.changeTimer =
                        45 +
                        Math.floor(
                            Math.random() *
                            100
                        );


                    const dx =
                        player.x -
                        enemy.x;


                    const dy =
                        player.y -
                        enemy.y;


                    /*
                     * Kadang mengejar player,
                     * kadang bergerak random.
                     */

                    if (
                        Math.random() <
                        0.65
                    ) {

                        if (
                            Math.abs(dx) >
                            Math.abs(dy)
                        ) {

                            enemy.dir =
                                dx > 0
                                    ? "RIGHT"
                                    : "LEFT";

                        } else {

                            enemy.dir =
                                dy > 0
                                    ? "DOWN"
                                    : "UP";
                        }

                    } else {

                        const dirs = [
                            "UP",
                            "DOWN",
                            "LEFT",
                            "RIGHT"
                        ];


                        enemy.dir =
                            dirs[
                                Math.floor(
                                    Math.random() *
                                    dirs.length
                                )
                            ];
                    }
                }


                let vx = 0;

                let vy = 0;


                if (
                    enemy.dir === "UP"
                ) {
                    vy =
                        -enemy.speed;
                }

                else if (
                    enemy.dir === "DOWN"
                ) {
                    vy =
                        enemy.speed;
                }

                else if (
                    enemy.dir === "LEFT"
                ) {
                    vx =
                        -enemy.speed;
                }

                else if (
                    enemy.dir === "RIGHT"
                ) {
                    vx =
                        enemy.speed;
                }


                const oldX =
                    enemy.x;

                const oldY =
                    enemy.y;


                enemy.x += vx;

                enemy.y += vy;


                /*
                 * Arena boundary.
                 */

                if (
                    enemy.x < 20 ||
                    enemy.x +
                    enemy.size >
                    canvas.clientWidth -
                    20
                ) {

                    enemy.x =
                        oldX;

                    enemy.dir =
                        enemy.dir === "LEFT"
                            ? "RIGHT"
                            : "LEFT";
                }


                if (
                    enemy.y < 60 ||
                    enemy.y +
                    enemy.size >
                    canvas.clientHeight -
                    20
                ) {

                    enemy.y =
                        oldY;

                    enemy.dir =
                        enemy.dir === "UP"
                            ? "DOWN"
                            : "UP";
                }


                /*
                 * Enemy shooting.
                 */

                enemy.shootTimer++;


                const shootDelay =
                    Math.max(
                        42,
                        78 -
                        level * 5
                    );


                if (
                    enemy.shootTimer >=
                    shootDelay
                ) {

                    enemy.shootTimer =
                        0;


                    enemyFire(
                        enemy
                    );
                }
            }
        }


        /* =========================================================
           ENEMY FIRE
           ========================================================= */

        function enemyFire(enemy) {

            let vx = 0;

            let vy = 0;

            const speed = 5.5;


            if (
                enemy.dir === "UP"
            ) {
                vy = -speed;
            }

            else if (
                enemy.dir === "DOWN"
            ) {
                vy = speed;
            }

            else if (
                enemy.dir === "LEFT"
            ) {
                vx = -speed;
            }

            else {
                vx = speed;
            }


            bullets.push({

                x:
                    enemy.x +
                    enemy.size / 2 -
                    3,

                y:
                    enemy.y +
                    enemy.size / 2 -
                    3,

                vx: vx,

                vy: vy,

                size: 7,

                isPlayer: false,

                isBazooka: false,

                life: 120
            });
        }


        /* =========================================================
           BOSS
           ========================================================= */

        function updateBoss() {

            if (!enemyBase) {
                return;
            }


            enemyBase.pulse +=
                0.045;


            enemyBase.shootTimer++;


            if (
                enemyBase.shootTimer >= 48
            ) {

                enemyBase.shootTimer =
                    0;


                /*
                 * Boss menembak ke arah player.
                 */

                const centerX =
                    enemyBase.x +
                    enemyBase.w / 2;


                const centerY =
                    enemyBase.y +
                    enemyBase.h / 2;


                const playerCenterX =
                    player.x +
                    player.size / 2;


                const playerCenterY =
                    player.y +
                    player.size / 2;


                const dx =
                    playerCenterX -
                    centerX;


                const dy =
                    playerCenterY -
                    centerY;


                const distance =
                    Math.max(
                        1,
                        Math.hypot(
                            dx,
                            dy
                        )
                    );


                const speed = 5.2;


                bullets.push({

                    x:
                        centerX - 5,

                    y:
                        centerY - 5,

                    vx:
                        (dx / distance) *
                        speed,

                    vy:
                        (dy / distance) *
                        speed,

                    size: 10,

                    isPlayer: false,

                    isBazooka: false,

                    life: 180
                });
            }
        }


        /* =========================================================
           POWERUP
           ========================================================= */

        function spawnPowerup(
            x,
            y
        ) {

            const types = [
                "heart",
                "bazooka",
                "shield"
            ];


            const type =
                types[
                    Math.floor(
                        Math.random() *
                        types.length
                    )
                ];


            powerups.push({

                x: x,

                y: y,

                size: 30,

                type: type,

                pulse:
                    Math.random() *
                    Math.PI *
                    2
            });
        }


        function updatePowerups() {

            for (
                const powerup
                of powerups
            ) {

                powerup.pulse +=
                    0.06;


                const bob =
                    Math.sin(
                        powerup.pulse
                    ) *
                    1.5;


                const px =
                    powerup.x;


                const py =
                    powerup.y +
                    bob;


                if (
                    rectsOverlap(
                        player.x,
                        player.y,
                        player.size,
                        player.size,

                        px,
                        py,
                        powerup.size,
                        powerup.size
                    )
                ) {

                    collectPowerup(
                        powerup
                    );


                    const index =
                        powerups.indexOf(
                            powerup
                        );


                    if (
                        index !== -1
                    ) {

                        powerups.splice(
                            index,
                            1
                        );
                    }
                }
            }
        }


        function collectPowerup(
            powerup
        ) {

            playSound(
                "powerup"
            );


            if (
                powerup.type ===
                "heart"
            ) {

                lives++;


                powerupStatus.innerText =
                    "EXTRA LIFE +1 💚";


                createFloatingText(
                    powerup.x,
                    powerup.y,
                    "+1 LIFE",
                    "#22c55e"
                );
            }


            else if (
                powerup.type ===
                "bazooka"
            ) {

                player.activePowerup =
                    "bazooka";


                player.powerupTimer =
                    450;


                powerupStatus.innerText =
                    "PLASMA BAZOOKA 🚀";


                createFloatingText(
                    powerup.x,
                    powerup.y,
                    "BAZOOKA!",
                    "#38bdf8"
                );
            }


            else if (
                powerup.type ===
                "shield"
            ) {

                player.activePowerup =
                    "shield";


                player.powerupTimer =
                    350;


                powerupStatus.innerText =
                    "ENERGY SHIELD 🛡️";


                createFloatingText(
                    powerup.x,
                    powerup.y,
                    "SHIELD!",
                    "#facc15"
                );
            }
        }


        /* =========================================================
           BULLETS
           ========================================================= */

        function updateBullets() {

            for (
                let i =
                bullets.length - 1;

                i >= 0;

                i--
            ) {

                const bullet =
                    bullets[i];


                bullet.x +=
                    bullet.vx;

                bullet.y +=
                    bullet.vy;


                bullet.life--;


                /*
                 * Remove expired bullets.
                 */

                if (
                    bullet.life <= 0 ||
                    bullet.x < -30 ||
                    bullet.x >
                    canvas.clientWidth + 30 ||
                    bullet.y < -30 ||
                    bullet.y >
                    canvas.clientHeight + 30
                ) {

                    bullets.splice(
                        i,
                        1
                    );

                    continue;
                }


                if (
                    bullet.isPlayer
                ) {

                    /*
                     * Boss collision.
                     */

                    if (
                        enemyBase &&
                        rectsOverlap(
                            bullet.x,
                            bullet.y,
                            bullet.size,
                            bullet.size,

                            enemyBase.x,
                            enemyBase.y,
                            enemyBase.w,
                            enemyBase.h
                        )
                    ) {

                        const damage =
                            bullet.isBazooka
                                ? 3
                                : 1;


                        enemyBase.health -=
                            damage;


                        createParticles(
                            bullet.x,
                            bullet.y,
                            "#ff0066",
                            10
                        );


                        createShockwave(
                            bullet.x,
                            bullet.y,
                            "#ff0066"
                        );


                        screenShake =
                            Math.max(
                                screenShake,
                                bullet.isBazooka
                                    ? 7
                                    : 3
                            );


                        bullets.splice(
                            i,
                            1
                        );


                        if (
                            enemyBase.health <=
                            0
                        ) {

                            createParticles(
                                enemyBase.x +
                                enemyBase.w / 2,

                                enemyBase.y +
                                enemyBase.h / 2,

                                "#facc15",
                                90
                            );


                            createShockwave(
                                enemyBase.x +
                                enemyBase.w / 2,

                                enemyBase.y +
                                enemyBase.h / 2,

                                "#facc15"
                            );


                            screenShake =
                                18;


                            score +=
                                5000;


                            /*
                             * Jangan lanjut mengubah
                             * state di tengah loop.
                             */

                            victory();

                            return;
                        }


                        continue;
                    }


                    /*
                     * Enemy collision.
                     */

                    let hitEnemy =
                        false;


                    for (
                        let e =
                        enemies.length - 1;

                        e >= 0;

                        e--
                    ) {

                        const enemy =
                            enemies[e];


                        if (
                            rectsOverlap(
                                bullet.x,
                                bullet.y,
                                bullet.size,
                                bullet.size,

                                enemy.x,
                                enemy.y,
                                enemy.size,
                                enemy.size
                            )
                        ) {

                            hitEnemy =
                                true;


                            if (
                                Math.random() <
                                0.35
                            ) {

                                spawnPowerup(
                                    enemy.x,
                                    enemy.y
                                );
                            }


                            score +=
                                bullet.isBazooka
                                    ? 300
                                    : 150;


                            createParticles(
                                enemy.x +
                                enemy.size / 2,

                                enemy.y +
                                enemy.size / 2,

                                enemy.color ||
                                "#ff0066",

                                bullet.isBazooka
                                    ? 38
                                    : 25
                            );


                            createShockwave(
                                enemy.x +
                                enemy.size / 2,

                                enemy.y +
                                enemy.size / 2,

                                bullet.isBazooka
                                    ? "#38bdf8"
                                    : "#ff0066"
                            );


                            createFloatingText(
                                enemy.x +
                                enemy.size / 2,

                                enemy.y,

                                bullet.isBazooka
                                    ? "+300"
                                    : "+150",

                                bullet.isBazooka
                                    ? "#38bdf8"
                                    : "#facc15"
                            );


                            screenShake =
                                Math.max(
                                    screenShake,
                                    bullet.isBazooka
                                        ? 7
                                        : 3
                                );


                            enemies.splice(
                                e,
                                1
                            );


                            playSound(
                                "explode"
                            );


                            break;
                        }
                    }


                    /*
                     * Normal bullet disappears after hit.
                     *
                     * Bazooka juga kita hilangkan setelah
                     * satu enemy supaya collision tidak
                     * menghasilkan multi-kill tak sengaja.
                     */

                    if (
                        hitEnemy
                    ) {

                        bullets.splice(
                            i,
                            1
                        );


                        /*
                         * Cek apakah wave selesai.
                         * Transisi TIDAK dilakukan di sini.
                         */

                        if (
                            enemies.length === 0 &&
                            enemiesRemaining === 0
                        ) {

                            queueNextWave();
                        }
                    }

                }

                else {

                    /*
                     * Enemy bullet vs player.
                     */

                    if (
                        rectsOverlap(
                            bullet.x,
                            bullet.y,
                            bullet.size,
                            bullet.size,

                            player.x,
                            player.y,
                            player.size,
                            player.size
                        )
                    ) {

                        bullets.splice(
                            i,
                            1
                        );


                        /*
                         * Shield.
                         */

                        if (
                            player.activePowerup ===
                            "shield"
                        ) {

                            createShockwave(
                                bullet.x,
                                bullet.y,
                                "#38bdf8"
                            );


                            createParticles(
                                bullet.x,
                                bullet.y,
                                "#38bdf8",
                                12
                            );


                            playSound(
                                "powerup"
                            );


                            continue;
                        }


                        /*
                         * Temporary invulnerability
                         * setelah terkena peluru.
                         */

                        if (
                            player.invulnerableTimer >
                            0
                        ) {

                            continue;
                        }


                        damagePlayer();

                        continue;
                    }
                }
            }
        }


        /* =========================================================
           PLAYER DAMAGE
           ========================================================= */

        function damagePlayer() {

            if (
                player.invulnerableTimer >
                0
            ) {
                return;
            }


            lives--;


            player.invulnerableTimer =
                100;


            player.vx = 0;

            player.vy = 0;


            createParticles(
                player.x +
                player.size / 2,

                player.y +
                player.size / 2,

                "#00ffcc",

                35
            );


            createShockwave(
                player.x +
                player.size / 2,

                player.y +
                player.size / 2,

                "#00ffcc"
            );


            screenShake =
                10;


            playSound(
                "explode"
            );


            if (
                lives <= 0
            ) {

                gameOver();

                return;
            }


            /*
             * Respawn.
             */

            player.x =
                canvas.clientWidth / 2 -
                player.size / 2;

            player.y =
                canvas.clientHeight -
                85;


            createFloatingText(
                player.x,
                player.y - 8,
                "-1 LIFE",
                "#ff0066"
            );
        }


        /* =========================================================
           WAVE TRANSITION
           ========================================================= */

        function queueNextWave() {

            if (
                pendingTransition
            ) {
                return;
            }


            pendingTransition =
                "next";


            playSound(
                "wave_clear"
            );


            createFloatingText(
                canvas.clientWidth / 2,
                canvas.clientHeight / 2,
                "WAVE CLEAR",
                "#00ffcc"
            );
        }


        function processPendingTransition() {

            if (
                !pendingTransition ||
                !isPlaying
            ) {
                return;
            }


            const transition =
                pendingTransition;


            pendingTransition =
                null;


            if (
                transition ===
                "next"
            ) {

                if (
                    wave === 1
                ) {

                    /*
                     * Wave 1 → Wave 2.
                     */

                    wave = 2;

                }

                else {

                    /*
                     * Wave 2 → Level berikutnya.
                     */

                    if (
                        level < 5
                    ) {

                        level++;

                        wave = 1;

                    }

                    else {

                        /*
                         * Kalau level 5 wave 2
                         * seharusnya sudah boss dan
                         * ditangani victory().
                         */

                        wave = 2;
                    }
                }


                initLevel();
            }
        }


        /* =========================================================
           PARTICLES
           ========================================================= */

        function createParticles(
            x,
            y,
            color,
            count
        ) {

            for (
                let i = 0;

                i < count;

                i++
            ) {

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const speed =
                    1 +
                    Math.random() *
                    6;


                particles.push({

                    x: x,

                    y: y,

                    vx:
                        Math.cos(angle) *
                        speed,

                    vy:
                        Math.sin(angle) *
                        speed,

                    radius:
                        1 +
                        Math.random() *
                        3.5,

                    color: color,

                    alpha: 1,

                    life:
                        25 +
                        Math.random() *
                        25
                });
            }
        }


        function updateParticles() {

            for (
                let i =
                particles.length - 1;

                i >= 0;

                i--
            ) {

                const particle =
                    particles[i];


                particle.x +=
                    particle.vx;

                particle.y +=
                    particle.vy;


                particle.vx *=
                    0.96;

                particle.vy *=
                    0.96;


                particle.life--;

                particle.alpha =
                    Math.max(
                        0,
                        particle.life /
                        50
                    );


                if (
                    particle.life <= 0
                ) {

                    particles.splice(
                        i,
                        1
                    );
                }
            }
        }


        /* =========================================================
           SHOCKWAVES
           ========================================================= */

        function createShockwave(
            x,
            y,
            color
        ) {

            shockwaves.push({

                x: x,

                y: y,

                radius: 4,

                maxRadius: 45,

                alpha: 1,

                color: color
            });
        }


        function updateShockwaves() {

            for (
                let i =
                shockwaves.length - 1;

                i >= 0;

                i--
            ) {

                const waveEffect =
                    shockwaves[i];


                waveEffect.radius +=
                    4;


                waveEffect.alpha -=
                    0.045;


                if (
                    waveEffect.alpha <= 0 ||
                    waveEffect.radius >
                    waveEffect.maxRadius
                ) {

                    shockwaves.splice(
                        i,
                        1
                    );
                }
            }
        }


        /* =========================================================
           MUZZLE FLASH
           ========================================================= */

        function updateMuzzleFlashes() {

            for (
                let i =
                muzzleFlashes.length - 1;

                i >= 0;

                i--
            ) {

                muzzleFlashes[i].life--;


                if (
                    muzzleFlashes[i].life <= 0
                ) {

                    muzzleFlashes.splice(
                        i,
                        1
                    );
                }
            }
        }


        /* =========================================================
           FLOATING TEXT
           ========================================================= */

        function createFloatingText(
            x,
            y,
            text,
            color
        ) {

            floatingTexts.push({

                x: x,

                y: y,

                text: text,

                color: color,

                alpha: 1,

                life: 50
            });
        }


        function updateFloatingTexts() {

            for (
                let i =
                floatingTexts.length - 1;

                i >= 0;

                i--
            ) {

                const item =
                    floatingTexts[i];


                item.y -=
                    0.7;

                item.life--;

                item.alpha =
                    item.life /
                    50;


                if (
                    item.life <= 0
                ) {

                    floatingTexts.splice(
                        i,
                        1
                    );
                }
            }
        }


        /* =========================================================
           COLLISION HELPER
           ========================================================= */

        function rectsOverlap(
            ax,
            ay,
            aw,
            ah,

            bx,
            by,
            bw,
            bh
        ) {

            return (
                ax < bx + bw &&
                ax + aw > bx &&
                ay < by + bh &&
                ay + ah > by
            );
        }


        /* =========================================================
           POWERUP TIMER
           ========================================================= */

        function updatePowerupTimer() {

            if (
                !player.activePowerup
            ) {
                return;
            }


            player.powerupTimer--;


            if (
                player.powerupTimer <= 0
            ) {

                player.activePowerup =
                    null;


                powerupStatus.innerText =
                    "";
            }
        }


        /* =========================================================
           PLAYER INVULNERABILITY
           ========================================================= */

        function updatePlayerInvulnerability() {

            if (
                player.invulnerableTimer >
                0
            ) {

                player.invulnerableTimer--;
            }
        }


        /* =========================================================
           ENEMY SPAWNER
           ========================================================= */

        function updateSpawner() {

            /*
             * Boss stage tidak memakai enemy normal.
             */

            if (
                level === 5 &&
                wave === 2
            ) {
                return;
            }


            enemySpawnTimer++;


            const spawnDelay =
                Math.max(
                    35,
                    62 -
                    level * 4
                );


            if (
                enemySpawnTimer >=
                spawnDelay
            ) {

                enemySpawnTimer =
                    0;


                spawnEnemy();
            }
        }


        /* =========================================================
           MAIN UPDATE
           ========================================================= */

        function update() {

            if (!isPlaying) {
                return;
            }


            /*
             * Transisi wave dilakukan SEBELUM
             * update object lainnya.
             *
             * Ini bagian penting yang memperbaiki
             * masalah state lama yang sebelumnya
             * bisa menyebabkan game aneh/blank.
             */

            if (
                pendingTransition
            ) {

                processPendingTransition();

                return;
            }


            gameTime++;


            /*
             * Cooldown.
             */

            if (
                player.fireCooldown >
                0
            ) {

                player.fireCooldown--;
            }


            updatePlayerInvulnerability();

            updatePowerupTimer();


            /*
             * Movement.
             */

            updatePlayerMovement();


            /*
             * Enemy.
             */

            updateSpawner();

            updateEnemies();

            updateBoss();


            /*
             * Powerups.
             */

            updatePowerups();


            /*
             * Bullets.
             */

            updateBullets();


            /*
             * Effects.
             */

            updateParticles();

            updateShockwaves();

            updateMuzzleFlashes();

            updateFloatingTexts();


            /*
             * Screen shake decay.
             */

            if (
                screenShake > 0
            ) {

                screenShake *=
                    0.86;


                if (
                    screenShake <
                    0.2
                ) {

                    screenShake = 0;
                }
            }
        }


        /* =========================================================
           SCREEN SHAKE
           ========================================================= */

        let screenShake = 0;


        /* =========================================================
           ARENA BACKGROUND
           ========================================================= */

        function drawArena() {

            const width =
                canvas.clientWidth;

            const height =
                canvas.clientHeight;


            /*
             * Background.
             */

            const gradient =
                ctx.createRadialGradient(
                    width / 2,
                    height / 2,
                    50,

                    width / 2,
                    height / 2,
                    Math.max(
                        width,
                        height
                    )
                );


            gradient.addColorStop(
                0,
                "#091824"
            );

            gradient.addColorStop(
                0.55,
                "#030a11"
            );

            gradient.addColorStop(
                1,
                "#010204"
            );


            ctx.fillStyle =
                gradient;


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /*
             * Grid.
             */

            ctx.save();


            ctx.strokeStyle =
                "rgba(0,255,204,0.055)";


            ctx.lineWidth = 1;


            const gridSize = 48;


            for (
                let x = 0;

                x <= width;

                x += gridSize
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    0
                );

                ctx.lineTo(
                    x,
                    height
                );

                ctx.stroke();
            }


            for (
                let y = 0;

                y <= height;

                y += gridSize
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    0,
                    y
                );

                ctx.lineTo(
                    width,
                    y
                );

                ctx.stroke();
            }


            ctx.restore();


            /*
             * Arena border.
             */

            ctx.save();

            ctx.strokeStyle =
                "rgba(0,255,204,0.28)";

            ctx.lineWidth = 2;

            ctx.strokeRect(
                18,
                58,
                width - 36,
                height - 78
            );


            /*
             * Corner accents.
             */

            drawCornerAccent(
                18,
                58,
                1,
                1
            );

            drawCornerAccent(
                width - 18,
                58,
                -1,
                1
            );

            drawCornerAccent(
                18,
                height - 20,
                1,
                -1
            );

            drawCornerAccent(
                width - 18,
                height - 20,
                -1,
                -1
            );


            ctx.restore();


            /*
             * Subtle scanlines.
             */

            ctx.fillStyle =
                "rgba(0,0,0,0.035)";


            for (
                let y = 60;

                y < height;

                y += 5
            ) {

                ctx.fillRect(
                    0,
                    y,
                    width,
                    1
                );
            }
        }


        function drawCornerAccent(
            x,
            y,
            sx,
            sy
        ) {

            ctx.save();

            ctx.strokeStyle =
                "#00ffcc";

            ctx.globalAlpha =
                0.65;

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x + 22 * sx,
                y
            );

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x,
                y + 22 * sy
            );

            ctx.stroke();

            ctx.restore();
        }


        /* =========================================================
           DRAW TANK
           ========================================================= */

        function drawTank(
            x,
            y,
            size,
            dir,
            color,
            isPlayer,
            enemyColor = "#ff0066"
        ) {

            ctx.save();


            ctx.translate(
                x + size / 2,
                y + size / 2
            );


            let angle = 0;


            if (
                dir === "DOWN"
            ) {
                angle =
                    Math.PI;
            }

            else if (
                dir === "LEFT"
            ) {
                angle =
                    -Math.PI / 2;
            }

            else if (
                dir === "RIGHT"
            ) {
                angle =
                    Math.PI / 2;
            }


            ctx.rotate(
                angle
            );


            const mainColor =
                isPlayer
                    ? color
                    : enemyColor;


            /*
             * Glow.
             */

            ctx.shadowColor =
                mainColor;

            ctx.shadowBlur =
                isPlayer
                    ? 15
                    : 10;


            /*
             * Shield.
             */

            if (
                isPlayer &&
                player.activePowerup ===
                "shield"
            ) {

                const shieldPulse =
                    1 +
                    Math.sin(
                        gameTime *
                        0.08
                    ) *
                    0.06;


                ctx.save();

                ctx.shadowColor =
                    "#38bdf8";

                ctx.shadowBlur =
                    20;


                ctx.strokeStyle =
                    "rgba(56,189,248,0.8)";

                ctx.lineWidth = 3;


                ctx.beginPath();

                ctx.arc(
                    0,
                    0,
                    size *
                    0.88 *
                    shieldPulse,

                    0,
                    Math.PI * 2
                );

                ctx.stroke();


                ctx.restore();
            }


            /*
             * Tank shadow.
             */

            ctx.shadowBlur = 0;

            ctx.fillStyle =
                "rgba(0,0,0,0.55)";

            ctx.fillRect(
                -size / 2 + 3,
                -size / 2 + 5,
                size,
                size
            );


            /*
             * Tracks.
             */

            ctx.fillStyle =
                "#05080b";


            ctx.fillRect(
                -size / 2,
                -size / 2,
                8,
                size
            );


            ctx.fillRect(
                size / 2 - 8,
                -size / 2,
                8,
                size
            );


            /*
             * Track highlights.
             */

            ctx.fillStyle =
                isPlayer
                    ? "rgba(0,255,204,0.45)"
                    : "rgba(255,0,102,0.38)";


            for (
                let ty = -size / 2 + 5;

                ty < size / 2 - 3;

                ty += 7
            ) {

                ctx.fillRect(
                    -size / 2 + 2,
                    ty,
                    4,
                    3
                );


                ctx.fillRect(
                    size / 2 - 6,
                    ty,
                    4,
                    3
                );
            }


            /*
             * Main hull.
             */

            ctx.fillStyle =
                mainColor;


            ctx.fillRect(
                -size / 2 + 7,
                -size / 2 + 3,
                size - 14,
                size - 6
            );


            /*
             * Inner hull.
             */

            ctx.fillStyle =
                isPlayer
                    ? "#006b59"
                    : "#7a1235";


            ctx.fillRect(
                -size / 2 + 10,
                -size / 2 + 7,
                size - 20,
                size - 14
            );


            /*
             * Highlight.
             */

            ctx.fillStyle =
                isPlayer
                    ? "rgba(255,255,255,0.22)"
                    : "rgba(255,255,255,0.15)";


            ctx.fillRect(
                -size / 2 + 10,
                -size / 2 + 7,
                size - 20,
                4
            );


            /*
             * Turret.
             */

            ctx.fillStyle =
                isPlayer
                    ? "#d9fff8"
                    : "#ffcc00";


            ctx.beginPath();

            ctx.arc(
                0,
                0,
                8,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                isPlayer
                    ? "#00a88d"
                    : "#991b3f";


            ctx.beginPath();

            ctx.arc(
                0,
                0,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * Barrel.
             */

            const bazooka =
                isPlayer &&
                player.activePowerup ===
                "bazooka";


            ctx.fillStyle =
                bazooka
                    ? "#38bdf8"
                    : (
                        isPlayer
                            ? "#ffffff"
                            : "#ffcc00"
                    );


            ctx.fillRect(
                -(
                    bazooka
                        ? 5
                        : 3
                ),
                -size / 2 - 14,
                bazooka
                    ? 10
                    : 6,
                bazooka
                    ? 28
                    : 25
            );


            /*
             * Barrel inner.
             */

            ctx.fillStyle =
                "#02050a";


            ctx.fillRect(
                -2,
                -size / 2 - 13,
                4,
                7
            );


            /*
             * Powerup glow.
             */

            if (bazooka) {

                ctx.save();

                ctx.shadowColor =
                    "#38bdf8";

                ctx.shadowBlur =
                    15;

                ctx.strokeStyle =
                    "#38bdf8";

                ctx.lineWidth = 2;

                ctx.strokeRect(
                    -size / 2 + 8,
                    -size / 2 + 5,
                    size - 16,
                    size - 10
                );

                ctx.restore();
            }


            ctx.restore();
        }


        /* =========================================================
           DRAW BOSS
           ========================================================= */

        function drawBoss() {

            if (!enemyBase) {
                return;
            }


            const base =
                enemyBase;


            const centerX =
                base.x +
                base.w / 2;


            const centerY =
                base.y +
                base.h / 2;


            const pulse =
                Math.sin(
                    base.pulse
                );


            /*
             * Outer glow.
             */

            ctx.save();


            ctx.shadowColor =
                "#ff0066";

            ctx.shadowBlur =
                25;


            ctx.fillStyle =
                "#350713";


            ctx.fillRect(
                base.x,
                base.y,
                base.w,
                base.h
            );


            ctx.restore();


            /*
             * Main body.
             */

            ctx.fillStyle =
                "#7f1d35";


            ctx.fillRect(
                base.x + 3,
                base.y + 3,
                base.w - 6,
                base.h - 6
            );


            /*
             * Inner reactor.
             */

            ctx.save();

            ctx.shadowColor =
                "#facc15";

            ctx.shadowBlur =
                15 +
                pulse * 5;


            ctx.fillStyle =
                "#facc15";


            ctx.fillRect(
                base.x + 16,
                base.y + 15,
                base.w - 32,
                base.h - 30
            );


            ctx.restore();


            /*
             * Boss core.
             */

            ctx.fillStyle =
                "#ff0066";


            ctx.beginPath();

            ctx.arc(
                centerX,
                centerY,
                12 +
                pulse * 2,

                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth = 2;

            ctx.stroke();


            /*
             * Boss label.
             */

            ctx.fillStyle =
                "#ffffff";


            ctx.font =
                "900 13px Orbitron, sans-serif";


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "alphabetic";


            ctx.fillText(
                "ENEMY COMMAND",
                centerX,
                base.y - 14
            );


            /*
             * HP background.
             */

            ctx.fillStyle =
                "#02050a";


            ctx.fillRect(
                base.x,
                base.y - 31,
                base.w,
                9
            );


            /*
             * HP bar.
             */

            const hpPercent =
                Math.max(
                    0,
                    base.health /
                    base.maxHealth
                );


            const hpGradient =
                ctx.createLinearGradient(
                    base.x,
                    0,
                    base.x +
                    base.w,
                    0
                );


            hpGradient.addColorStop(
                0,
                "#ff0066"
            );

            hpGradient.addColorStop(
                1,
                "#facc15"
            );


            ctx.fillStyle =
                hpGradient;


            ctx.fillRect(
                base.x,
                base.y - 31,
                base.w *
                hpPercent,
                9
            );


            ctx.strokeStyle =
                "rgba(255,255,255,0.55)";

            ctx.lineWidth = 1;

            ctx.strokeRect(
                base.x,
                base.y - 31,
                base.w,
                9
            );
        }


        /* =========================================================
           DRAW POWERUPS
           ========================================================= */

        function drawPowerups() {

            for (
                const powerup
                of powerups
            ) {

                const bob =
                    Math.sin(
                        powerup.pulse
                    ) *
                    1.5;


                const cx =
                    powerup.x +
                    powerup.size / 2;


                const cy =
                    powerup.y +
                    powerup.size / 2 +
                    bob;


                let color =
                    "#22c55e";


                let symbol =
                    "♥";


                if (
                    powerup.type ===
                    "bazooka"
                ) {

                    color =
                        "#38bdf8";

                    symbol =
                        "⚡";
                }


                else if (
                    powerup.type ===
                    "shield"
                ) {

                    color =
                        "#facc15";

                    symbol =
                        "◆";
                }


                ctx.save();


                ctx.shadowColor =
                    color;

                ctx.shadowBlur =
                    18;


                ctx.fillStyle =
                    color;


                ctx.beginPath();

                ctx.arc(
                    cx,
                    cy,
                    powerup.size / 2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                ctx.shadowBlur = 0;


                ctx.strokeStyle =
                    "#ffffff";

                ctx.globalAlpha =
                    0.85;

                ctx.lineWidth = 2;

                ctx.stroke();


                ctx.fillStyle =
                    "#02050a";


                ctx.font =
                    "900 14px Orbitron, sans-serif";


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.fillText(
                    symbol,
                    cx,
                    cy + 1
                );


                ctx.restore();
            }
        }


        /* =========================================================
           DRAW BULLETS
           ========================================================= */

        function drawBullets() {

            for (
                const bullet
                of bullets
            ) {

                const color =
                    bullet.isBazooka
                        ? "#38bdf8"
                        : (
                            bullet.isPlayer
                                ? "#facc15"
                                : "#ff1744"
                        );


                const centerX =
                    bullet.x +
                    bullet.size / 2;


                const centerY =
                    bullet.y +
                    bullet.size / 2;


                /*
                 * Trail.
                 */

                ctx.save();


                ctx.globalAlpha =
                    0.35;


                ctx.strokeStyle =
                    color;


                ctx.lineWidth =
                    bullet.isBazooka
                        ? 5
                        : 3;


                ctx.beginPath();


                ctx.moveTo(
                    centerX -
                    bullet.vx * 1.6,

                    centerY -
                    bullet.vy * 1.6
                );


                ctx.lineTo(
                    centerX,
                    centerY
                );


                ctx.stroke();


                /*
                 * Projectile.
                 */

                ctx.globalAlpha =
                    1;


                ctx.shadowColor =
                    color;


                ctx.shadowBlur =
                    bullet.isBazooka
                        ? 18
                        : 10;


                ctx.fillStyle =
                    color;


                ctx.beginPath();


                ctx.arc(
                    centerX,
                    centerY,
                    bullet.size / 2,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                ctx.restore();
            }
        }


        /* =========================================================
           DRAW PARTICLES
           ========================================================= */

        function drawParticles() {

            for (
                const particle
                of particles
            ) {

                ctx.save();


                ctx.globalAlpha =
                    particle.alpha;


                ctx.fillStyle =
                    particle.color;


                ctx.shadowColor =
                    particle.color;

                ctx.shadowBlur =
                    8;


                ctx.beginPath();


                ctx.arc(
                    particle.x,
                    particle.y,
                    particle.radius,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                ctx.restore();
            }
        }


        /* =========================================================
           DRAW SHOCKWAVES
           ========================================================= */

        function drawShockwaves() {

            for (
                const waveEffect
                of shockwaves
            ) {

                ctx.save();


                ctx.globalAlpha =
                    waveEffect.alpha;


                ctx.strokeStyle =
                    waveEffect.color;


                ctx.shadowColor =
                    waveEffect.color;

                ctx.shadowBlur =
                    10;


                ctx.lineWidth = 2;


                ctx.beginPath();


                ctx.arc(
                    waveEffect.x,
                    waveEffect.y,
                    waveEffect.radius,
                    0,
                    Math.PI * 2
                );


                ctx.stroke();


                ctx.restore();
            }
        }


        /* =========================================================
           DRAW MUZZLE FLASH
           ========================================================= */

        function drawMuzzleFlashes() {

            for (
                const flash
                of muzzleFlashes
            ) {

                const alpha =
                    flash.life /
                    flash.maxLife;


                ctx.save();


                ctx.globalAlpha =
                    alpha;


                ctx.fillStyle =
                    flash.color;


                ctx.shadowColor =
                    flash.color;

                ctx.shadowBlur =
                    20;


                ctx.beginPath();


                ctx.arc(
                    flash.x,
                    flash.y,
                    4 +
                    (1 - alpha) * 7,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                ctx.restore();
            }
        }


        /* =========================================================
           DRAW FLOATING TEXT
           ========================================================= */

        function drawFloatingTexts() {

            for (
                const item
                of floatingTexts
            ) {

                ctx.save();


                ctx.globalAlpha =
                    item.alpha;


                ctx.fillStyle =
                    item.color;


                ctx.shadowColor =
                    item.color;

                ctx.shadowBlur =
                    8;


                ctx.font =
                    "900 13px Orbitron, sans-serif";


                ctx.textAlign =
                    "center";


                ctx.fillText(
                    item.text,
                    item.x,
                    item.y
                );


                ctx.restore();
            }
        }


        /* =========================================================
           PLAYER DAMAGE FLASH
           ========================================================= */

        function drawPlayerDamageEffect() {

            if (
                player.invulnerableTimer <=
                0
            ) {
                return;
            }


            /*
             * Blink tank when recently hit.
             */

            if (
                Math.floor(
                    player.invulnerableTimer /
                    6
                ) % 2 === 0
            ) {
                return;
            }


            ctx.save();


            ctx.globalAlpha =
                0.55;


            ctx.fillStyle =
                "#ffffff";


            ctx.beginPath();


            ctx.arc(
                player.x +
                player.size / 2,

                player.y +
                player.size / 2,

                player.size * 0.72,

                0,
                Math.PI * 2
            );


            ctx.fill();


            ctx.restore();
        }


        /* =========================================================
           DRAW
           ========================================================= */

        function draw() {

            const width =
                canvas.clientWidth;

            const height =
                canvas.clientHeight;


            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            /*
             * Screen shake.
             */

            ctx.save();


            if (
                screenShake > 0
            ) {

                const shakeX =
                    (Math.random() - 0.5) *
                    screenShake;


                const shakeY =
                    (Math.random() - 0.5) *
                    screenShake;


                ctx.translate(
                    shakeX,
                    shakeY
                );
            }


            drawArena();


            /*
             * Boss.
             */

            drawBoss();


            /*
             * Powerups.
             */

            drawPowerups();


            /*
             * Particles behind tanks.
             */

            drawParticles();


            /*
             * Enemies.
             */

            for (
                const enemy
                of enemies
            ) {

                drawTank(
                    enemy.x,
                    enemy.y,
                    enemy.size,
                    enemy.dir,
                    enemy.color,
                    false,
                    enemy.color
                );
            }


            /*
             * Player.
             */

            /*
             * Blink after damage.
             */

            const playerVisible =
                player.invulnerableTimer <=
                0 ||
                Math.floor(
                    player.invulnerableTimer /
                    6
                ) % 2 === 0;


            if (
                playerVisible
            ) {

                drawTank(
                    player.x,
                    player.y,
                    player.size,
                    player.dir,
                    "#00ffcc",
                    true
                );
            }


            /*
             * Bullets.
             */

            drawBullets();


            /*
             * Effects.
             */

            drawShockwaves();

            drawMuzzleFlashes();

            drawFloatingTexts();


            ctx.restore();


            updateHUD();
        }


        /* =========================================================
           HUD
           ========================================================= */

        function updateHUD() {

            scoreDisplay.innerText =
                `SCORE: ${
                    Math.floor(score)
                        .toString()
                        .padStart(4, "0")
                }`;


            livesDisplay.innerText =
                `LIVES: ${lives} 💚`;


            if (
                level === 5 &&
                wave === 2 &&
                enemyBase
            ) {

                levelDisplay.innerText =
                    "FINAL BOSS";


                enemiesLeft.innerText =
                    `BOSS HP: ${
                        Math.max(
                            0,
                            enemyBase.health
                        )
                    }`;

            }

            else {

                levelDisplay.innerText =
                    `LVL ${level}-${wave}`;


                enemiesLeft.innerText =
                    `ENEMIES: ${
                        enemiesRemaining +
                        enemies.length
                    }`;
            }


            /*
             * Powerup timer.
             */

            if (
                player.activePowerup
            ) {

                const seconds =
                    Math.ceil(
                        player.powerupTimer /
                        60
                    );


                if (
                    player.activePowerup ===
                    "bazooka"
                ) {

                    powerupStatus.innerText =
                        `PLASMA BAZOOKA 🚀 ${seconds}s`;

                }

                else if (
                    player.activePowerup ===
                    "shield"
                ) {

                    powerupStatus.innerText =
                        `ENERGY SHIELD 🛡️ ${seconds}s`;
                }

            }
        }


        /* =========================================================
           GAME LOOP
           ========================================================= */

        let gameLoopRunning =
            false;


        function loop() {

            if (!isPlaying) {

                gameLoopRunning =
                    false;

                return;
            }


            update();

            draw();


            requestAnimationFrame(
                loop
            );
        }


        /* =========================================================
           INITIAL STATE
           ========================================================= */

        resizeCanvas();

        updateHUD();


        /*
         * Jangan otomatis start game.
         * Player harus menekan DEPLOY.
         */

    </script>
