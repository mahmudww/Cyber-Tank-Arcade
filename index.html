<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Tank Arcade</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030305;
            font-family: 'VT323', monospace;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #090a0f;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0d1117;
        }
        
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            background: rgba(13, 17, 23, 0.8);
            border-bottom: 2px solid #1f293d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-hud {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            display: flex;
            gap: 25px;
        }
        .status-hud {
            font-size: 20px;
            display: flex;
            gap: 25px;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
        }

        /* Tombol Fire Transparan Floating di Kanan (Mobile) */
        .mobile-fire-btn {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 127, 0.35);
            border: 2px solid rgba(255, 51, 153, 0.7);
            color: rgba(255, 255, 255, 0.9);
            font-family: 'VT323', monospace;
            font-size: 26px;
            font-weight: bold;
            border-radius: 50%;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 15;
            transition: background 0.1s, transform 0.1s;
        }
        .mobile-fire-btn:active {
            background: rgba(255, 0, 127, 0.7);
            transform: scale(0.92);
        }

        /* Floating Joystick Visual (Mobile) */
        #virtual-joystick {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(0, 255, 204, 0.1);
            border: 2px solid rgba(0, 255, 204, 0.3);
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
            z-index: 15;
        }
        #joystick-thumb-fluid {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(0, 255, 204, 0.6);
            border: 2px solid #ffffff;
            top: 37.5px;
            left: 37.5px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.8);
        }

        /* Layar Peringatan Rotasi HP */
        #rotateNotice {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #030305;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
        }
        #rotateNotice h2 {
            color: #ff007f;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,0,127,0.6);
        }
        #rotateNotice p {
            color: #00ffcc;
            font-size: 18px;
            line-height: 1.4;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 5, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }
        h1 {
            font-size: 64px;
            margin-bottom: 5px;
            color: #ff007f;
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
            letter-spacing: 3px;
        }
        p {
            color: #00ffcc;
            font-size: 20px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            line-height: 1.5;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.4);
        }
        .btn {
            background: #00ffcc;
            color: #030305;
            border: none;
            padding: 12px 40px;
            font-family: 'VT323', monospace;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            transition: all 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #ffffff;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Layar Peringatan Rotasi HP -->
    <div id="rotateNotice">
        <h2>🔄 PLEASE ROTATE YOUR DEVICE</h2>
        <p>For the best immersive arcade experience, please rotate your smartphone to <b>Landscape</b> mode.</p>
    </div>

    <div id="game-container">
        <!-- HUD Layer -->
        <div class="ui-layer">
            <div class="header-hud">
                <span id="scoreDisplay">SCORE: 0000</span>
                <span id="waveDisplay" style="color: #ff007f;">WAVE 1</span>
            </div>
            <div class="status-hud">
                <span id="livesDisplay">LIVES: 3 💚</span>
                <span id="enemiesLeft">ENEMIES: 10</span>
            </div>
        </div>

        <!-- Canvas Game Full Screen -->
        <canvas id="gameCanvas"></canvas>

        <!-- Floating Joystick Visual (Mobile) -->
        <div id="virtual-joystick">
            <div id="joystick-thumb-fluid"></div>
        </div>

        <!-- Tombol Fire Translucent Mobile -->
        <button id="mobileFireBtn" class="mobile-fire-btn">FIRE</button>

        <!-- Start Screen -->
        <div id="startScreen" class="screen">
            <h1>CYBER TANK</h1>
            <p id="guideText">Protect the Base • Destroy Enemy Tanks</p>
            <button class="btn" onclick="startGame()">START BATTLE</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: #ff3333; text-shadow: 0 0 15px rgba(255,51,51,0.7);">GAME OVER</h1>
            <p id="finalScoreText" style="color: #8b949e;">BASE DESTROYED OR LIVES LOST</p>
            <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        function checkDeviceLayout() {
            if (isTouchDevice) {
                if (window.innerHeight > window.innerWidth) {
                    document.getElementById('rotateNotice').style.display = 'flex';
                } else {
                    document.getElementById('rotateNotice').style.display = 'none';
                    document.getElementById('mobileFireBtn').style.display = 'flex';
                    document.getElementById('guideText').innerHTML = "Defend the Base • Touch Left Screen to Move & Right Fire to Shoot";
                }
            } else {
                document.getElementById('rotateNotice').style.display = 'none';
                document.getElementById('mobileFireBtn').style.display = 'none';
                document.getElementById('guideText').innerHTML = "Defend the Base • Destroy Enemy Tanks<br><span style='color:#ffb86c; font-size:18px;'>Move: WASD / Arrow Keys &nbsp;|&nbsp; Shoot: Spacebar</span>";
            }
            resizeCanvas();
        }

        window.addEventListener('resize', checkDeviceLayout);
        window.addEventListener('orientationchange', checkDeviceLayout);
        checkDeviceLayout();

        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startBGM();
        }

        // Musik Latar Belakang Synthwave Retro (*BGM Arpeggio Aktif*)
        function startBGM() {
            if (bgmInterval) return;
            const bassNotes = [110, 123.47, 130.81, 146.83, 164.81, 196];
            let step = 0;

            bgmInterval = setInterval(() => {
                if (!isPlaying || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(bassNotes[step % bassNotes.length], audioCtx.currentTime);

                    let filter = audioCtx.createBiquadFilter();
                    filter.type = "lowpass";
                    filter.frequency.setValueAtTime(800, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.22);
                    step++;
                } catch(e) {}
            }, 250);
        }

        function stopAudio() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === "shoot") {
                    osc.type = "square";
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === "explode") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(25, now + 0.35);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === "wave_clear") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(170, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.65);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                    osc.start(now);
                    osc.stop(now + 0.65);
                }
            } catch (e) {}
        }

        let isPlaying = false;
        let score = 0;
        let lives = 3;
        let wave = 1;
        let enemiesRemaining = 10;
        let baseDestroyed = false;

        let player = {
            x: 0, y: 0,
            size: 34,
            speed: 3.6, // Kecepatan gerak lebih lincah dan responsif
            dir: 'UP'
        };

        let base = { x: 0, y: 0, size: 34, alive: true };
        let bullets = [];
        let enemies = [];
        let walls = [];
        let particles = [];
        let enemySpawnTimer = 0;

        // --- Logika Floating Joystick Sensitivitas Tinggi ---
        let joystickVector = { x: 0, y: 0 };
        let joystickActive = false;
        let joystickTouchId = null;
        const joystickEl = document.getElementById('virtual-joystick');
        const thumbEl = document.getElementById('joystick-thumb-fluid');
        let joystickOrigin = { x: 0, y: 0 };

        window.addEventListener('touchstart', (e) => {
            if (!isPlaying || !isTouchDevice) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.clientX < window.innerWidth / 2 && !joystickActive) {
                    joystickActive = true;
                    joystickTouchId = touch.identifier;
                    joystickOrigin.x = touch.clientX;
                    joystickOrigin.y = touch.clientY;

                    joystickEl.style.display = 'block';
                    joystickEl.style.left = touch.clientX + 'px';
                    joystickEl.style.top = touch.clientY + 'px';
                    thumbEl.style.transform = `translate(0px, 0px)`;
                    joystickVector.x = 0;
                    joystickVector.y = 0;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    let dx = touch.clientX - joystickOrigin.x;
                    let dy = touch.clientY - joystickOrigin.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let maxRadius = 45;

                    if (distance > maxRadius) {
                        dx = (dx / distance) * maxRadius;
                        dy = (dy / distance) * maxRadius;
                        distance = maxRadius;
                    }

                    thumbEl.style.transform = `translate(${dx}px, ${dy}px)`;
                    // Sensitivitas dipertinggi dengan pengali responsif
                    joystickVector.x = dx / maxRadius;
                    joystickVector.y = dy / maxRadius;
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            if (!joystickActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    joystickActive = false;
                    joystickTouchId = null;
                    joystickEl.style.display = 'none';
                    joystickVector.x = 0;
                    joystickVector.y = 0;
                }
            }
        });

        document.getElementById('mobileFireBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            playerFire();
        });

        // Kontrol Keyboard Laptop
        let keys = {};
        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            keys[e.code] = true;
            if (e.code === 'Space') {
                playerFire();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function playerFire() {
            if (!isPlaying) return;
            let playerBullets = bullets.filter(b => b.isPlayer);
            if (playerBullets.length < 3) { // Maksimal 3 peluru aktif agar bisa menembak lebih leluasa
                playSound("shoot");
                let bx = player.x + player.size / 2 - 3;
                let by = player.y + player.size / 2 - 3;
                let vx = 0, vy = 0;
                let speed = 8;

                if (player.dir === 'UP') vy = -speed;
                else if (player.dir === 'DOWN') vy = speed;
                else if (player.dir === 'LEFT') vx = -speed;
                else if (player.dir === 'RIGHT') vx = speed;

                bullets.push({ x: bx, y: by, vx: vx, vy: vy, size: 6, isPlayer: true });
            }
        }

        function initLevel() {
            resizeCanvas();
            player.x = canvas.width / 2 - 50;
            player.y = canvas.height - 80;
            player.dir = 'UP';

            base.x = canvas.width / 2 - 17;
            base.y = canvas.height - 45;
            base.alive = true;
            baseDestroyed = false;

            bullets = [];
            enemies = [];
            particles = [];
            enemiesRemaining = 8 + (wave * 2);

            walls = [];
            let cols = Math.floor(canvas.width / 50);
            let rows = Math.floor(canvas.height / 50);
            for (let r = 2; r < rows - 3; r++) {
                for (let c = 1; c < cols - 1; c++) {
                    let distToBase = Math.hypot((c * 50) - base.x, (r * 50) - base.y);
                    if (distToBase > 90 && Math.random() > 0.42) {
                        walls.push({ x: c * 50, y: r * 50, w: 42, h: 18 });
                    }
                }
            }
        }

        function startGame() {
            initAudio();
            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            
            score = 0;
            lives = 3;
            wave = 1;
            isPlaying = true;
            initLevel();
            loop();
        }

        function gameOver() {
            isPlaying = false;
            stopAudio();
            playSound("gameover");
            document.getElementById("gameOverScreen").classList.remove("hidden");
        }

        function spawnEnemy() {
            if (enemies.length < 3 + Math.floor(wave/2) && enemiesRemaining > 0) {
                let spawnX = Math.random() > 0.5 ? 40 : canvas.width - 80;
                enemies.push({
                    x: spawnX,
                    y: 60,
                    size: 34,
                    speed: 1.3 + (wave * 0.1),
                    dir: 'DOWN',
                    shootTimer: 0
                });
                enemiesRemaining--;
            }
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3.5 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function update() {
            if (!isPlaying) return;

            let nextX = player.x;
            let nextY = player.y;

            // Gerakan Keyboard Laptop
            if (keys['KeyW'] || keys['ArrowUp']) {
                player.dir = 'UP'; nextY -= player.speed;
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                player.dir = 'DOWN'; nextY += player.speed;
            } else if (keys['KeyA'] || keys['ArrowLeft']) {
                player.dir = 'LEFT'; nextX -= player.speed;
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                player.dir = 'RIGHT'; nextX += player.speed;
            } 
            // Gerakan Floating Joystick HP (Sensitivitas Tinggi)
            else if (joystickActive) {
                nextX += joystickVector.x * player.speed * 1.1;
                nextY += joystickVector.y * player.speed * 1.1;

                if (Math.abs(joystickVector.x) > Math.abs(joystickVector.y)) {
                    player.dir = joystickVector.x > 0 ? 'RIGHT' : 'LEFT';
                } else {
                    player.dir = joystickVector.y > 0 ? 'DOWN' : 'UP';
                }
            }

            if (nextX >= 20 && nextX + player.size <= canvas.width - 20 &&
                nextY >= 60 && nextY + player.size <= canvas.height - 20) {
                player.x = nextX;
                player.y = nextY;
            }

            enemySpawnTimer++;
            if (enemySpawnTimer % 80 === 0) {
                spawnEnemy();
            }

            for (let en of enemies) {
                if (Math.random() < 0.035) {
                    let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                    en.dir = dirs[Math.floor(Math.random() * dirs.length)];
                }

                let evx = 0, evy = 0;
                if (en.dir === 'UP') evy = -en.speed;
                else if (en.dir === 'DOWN') evy = en.speed;
                else if (en.dir === 'LEFT') evx = -en.speed;
                else if (en.dir === 'RIGHT') evx = en.speed;

                en.x += evx;
                en.y += evy;

                if (en.x < 20 || en.x + en.size > canvas.width - 20) en.x -= evx;
                if (en.y < 60 || en.y + en.size > canvas.height - 20) en.y -= evy;

                en.shootTimer++;
                if (en.shootTimer > 70) {
                    en.shootTimer = 0;
                    let ebx = en.x + en.size / 2 - 3;
                    let eteby = en.y + en.size / 2 - 3;
                    let bvx = 0, bvy = 0;
                    let bspeed = 5;
                    if (en.dir === 'UP') bvy = -bspeed;
                    else if (en.dir === 'DOWN') bvy = bspeed;
                    else if (en.dir === 'LEFT') bvx = -bspeed;
                    else if (en.dir === 'RIGHT') bvx = bspeed;

                    bullets.push({ x: ebx, y: eteby, vx: bvx, vy: bvy, size: 6, isPlayer: false });
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                let hitWall = false;
                for (let w = walls.length - 1; w >= 0; w--) {
                    let wall = walls[w];
                    if (b.x < wall.x + wall.w && b.x + b.size > wall.x &&
                        b.y < wall.y + wall.h && b.y + b.size > wall.y) {
                        walls.splice(w, 1);
                        hitWall = true;
                        createParticles(wall.x + wall.w/2, wall.y + wall.h/2, "#ffb86c", 8);
                        break;
                    }
                }
                if (hitWall) {
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.isPlayer) {
                    let hitEnemy = false;
                    for (let e = enemies.length - 1; e >= 0; e--) {
                        let en = enemies[e];
                        if (b.x < en.x + en.size && b.x + b.size > en.x &&
                            b.y < en.y + en.size && b.y + b.size > en.y) {
                            enemies.splice(e, 1);
                            hitEnemy = true;
                            score += 100;
                            playSound("explode");
                            createParticles(en.x + en.size/2, en.y + en.size/2, "#ff007f", 20);
                            
                            if (enemies.length === 0 && enemiesRemaining === 0) {
                                wave++;
                                playSound("wave_clear");
                                initLevel();
                            }
                            break;
                        }
                    }
                    if (hitEnemy) {
                        bullets.splice(i, 1);
                        continue;
                    }
                } else {
                    if (b.x < player.x + player.size && b.x + b.size > player.x &&
                        b.y < player.y + player.size && b.y + b.size > player.y) {
                        lives--;
                        playSound("explode");
                        createParticles(player.x + player.size/2, player.y + player.size/2, "#00ffcc", 25);
                        bullets.splice(i, 1);
                        if (lives <= 0) {
                            gameOver();
                            return;
                        } else {
                            player.x = canvas.width / 2 - 50;
                            player.y = canvas.height - 80;
                        }
                        continue;
                    }

                    if (base.alive && b.x < base.x + base.size && b.x + b.size > base.x &&
                        b.y < base.y + base.size && b.y + b.size > base.y) {
                        base.alive = false;
                        baseDestroyed = true;
                        playSound("explode");
                        createParticles(base.x + base.size/2, base.y + base.size/2, "#ff3333", 40);
                        gameOver();
                        return;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // FUNGSI RENDER TANK ESTETIK TINGGI (Desain Detail Modern Neo-Retro)
        function drawTank(x, y, size, dir, color, isPlayer) {
            ctx.save();
            ctx.translate(x + size / 2, y + size / 2);

            let angle = 0;
            if (dir === 'DOWN') angle = Math.PI;
            else if (dir === 'LEFT') angle = -Math.PI / 2;
            else if (dir === 'RIGHT') angle = Math.PI / 2;
            ctx.rotate(angle);

            // Bayangan Tank
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.fillRect(-size/2 + 2, -size/2 + 2, size, size);

            // Trek Roda Kiri & Kanan (Dilengkapi garis tekstur)
            ctx.fillStyle = "#111827";
            ctx.fillRect(-size/2, -size/2, 8, size);
            ctx.fillRect(size/2 - 8, -size/2, 8, size);
            ctx.fillStyle = "#374151";
            ctx.fillRect(-size/2 + 2, -size/2 + 4, 4, size - 8);
            ctx.fillRect(size/2 - 6, -size/2 + 4, 4, size - 8);

            // Bodi Utama Tank (Gradasi Neon Halus)
            ctx.fillStyle = color;
            ctx.fillRect(-size/2 + 8, -size/2 + 4, size - 16, size - 8);
            
            // Aksen Armor Tengah
            ctx.fillStyle = isPlayer ? "#00b38f" : "#b30047";
            ctx.fillRect(-size/2 + 10, -size/2 + 8, size - 20, size - 16);

            // Laras Meriam (Keren & Proporsional)
            ctx.fillStyle = isPlayer ? "#ffffff" : "#ff3333";
            ctx.fillRect(-3.5, -size/2 - 11, 7, 22);
            ctx.fillStyle = "#090a0f";
            ctx.fillRect(-1.5, -size/2 - 11, 3, 4);

            // Kubah / Turret Center (Pusat Putar)
            ctx.fillStyle = "#090a0f";
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid Latar Belakang Estetik
            ctx.strokeStyle = "#161b22";
            ctx.lineWidth = 1.2;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Dinding Bata Estetik
            for (let wall of walls) {
                ctx.fillStyle = "#f59e0b";
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeStyle = "#78350f";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            }

            // Markas Base Estetik
            if (base.alive) {
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(base.x, base.y, base.size, base.size);
                ctx.fillStyle = "#ff007f";
                ctx.fillRect(base.x + 6, base.y + 6, base.size - 12, base.size - 12);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px 'VT323', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("BASE", base.x + base.size/2, base.y + base.size/2);
            }

            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Gambar Tank Pemain & Musuh
            drawTank(player.x, player.y, player.size, player.dir, "#00ffcc", true);

            for (let en of enemies) {
                drawTank(en.x, en.y, en.size, en.dir, "#ff0066", false);
            }

            // Gambar Peluru
            for (let b of bullets) {
                ctx.fillStyle = b.isPlayer ? "#facc15" : "#ef4444";
                ctx.beginPath();
                ctx.arc(b.x + b.size/2, b.y + b.size/2, b.size/2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Efek Scanline CRT Arcade
            ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
            for (let sy = 0; sy < canvas.height; sy += 4) {
                ctx.fillRect(0, sy, canvas.width, 1);
            }

            document.getElementById("scoreDisplay").innerText = `SCORE: ${Math.floor(score).toString().padStart(4, '0')}`;
            document.getElementById("waveDisplay").innerText = `WAVE ${wave}`;
            document.getElementById("livesDisplay").innerText = `LIVES: ${lives} 💚`;
            document.getElementById("enemiesLeft").innerText = `ENEMIES: ${enemiesRemaining + enemies.length}`;
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
