<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>Cyber Tank: Operation Frontline</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           CYBER TANK v2
           PART 1/3 — HTML + CSS
           ========================================================= */

        :root {
            --cyan: #00ffcc;
            --cyan-bright: #7ffff0;
            --pink: #ff0066;
            --pink-bright: #ff4d94;
            --blue: #38bdf8;
            --yellow: #facc15;
            --green: #22c55e;

            --bg: #02050a;
            --panel: rgba(2, 8, 14, 0.88);
            --panel-dark: rgba(1, 4, 8, 0.94);

            --border-cyan: rgba(0, 255, 204, 0.45);
            --border-pink: rgba(255, 0, 102, 0.45);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #07121c 0%,
                    #02050a 55%,
                    #000000 100%
                );

            font-family: "Orbitron", sans-serif;
            color: var(--cyan);

            position: fixed;
            inset: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================================
           GAME CONTAINER
           ========================================================= */

        #game-container {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #02050a;

            isolation: isolate;
        }

        #gameCanvas {
            position: absolute;
            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    circle at center,
                    #08131d 0%,
                    #03070c 70%,
                    #010204 100%
                );

            z-index: 1;
        }

        /* =========================================================
           TOP HUD
           ========================================================= */

        .ui-layer {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            min-height: 58px;

            padding:
                max(9px, env(safe-area-inset-top))
                max(14px, env(safe-area-inset-right))
                9px
                max(14px, env(safe-area-inset-left));

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            pointer-events: none;

            z-index: 30;

            background:
                linear-gradient(
                    180deg,
                    rgba(1, 7, 12, 0.96),
                    rgba(1, 7, 12, 0.78)
                );

            border-bottom: 1px solid var(--border-cyan);

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.45),
                0 1px 0 rgba(0, 255, 204, 0.08);
        }

        .ui-layer::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -1px;

            width: 100%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    transparent
                );

            opacity: 0.35;
        }

        .header-hud,
        .status-hud {
            display: flex;
            align-items: center;

            gap: clamp(8px, 2vw, 22px);

            min-width: 0;

            text-shadow:
                0 0 8px rgba(0, 255, 204, 0.55);
        }

        .header-hud {
            font-size: clamp(10px, 1.8vw, 15px);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .status-hud {
            justify-content: flex-end;

            font-size: clamp(9px, 1.7vw, 14px);
            font-weight: 700;

            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.3);
        }

        .hud-chip {
            white-space: nowrap;

            padding: 5px 8px;

            border: 1px solid rgba(0, 255, 204, 0.14);

            background:
                rgba(0, 255, 204, 0.035);

            box-shadow:
                inset 0 0 12px rgba(0, 255, 204, 0.025);
        }

        #scoreDisplay {
            color: var(--cyan);
        }

        #levelDisplay {
            color: var(--cyan-bright);
        }

        #powerupStatus {
            color: var(--blue);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        #livesDisplay {
            color: #d8fff7;
        }

        #enemiesLeft {
            color: #ffb4ca;
        }

        /* =========================================================
           MOBILE FIRE ZONE
           ========================================================= */

        #fire-zone-visual {
            position: absolute;

            right: max(18px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));

            width: clamp(92px, 14vw, 125px);
            height: clamp(92px, 14vw, 125px);

            border-radius: 50%;

            display: none;

            align-items: center;
            justify-content: center;

            color: rgba(255, 120, 165, 0.75);

            font-size: clamp(9px, 1.7vw, 13px);
            font-weight: 900;

            letter-spacing: 1px;

            pointer-events: none;

            z-index: 20;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 0, 102, 0.10) 0%,
                    rgba(255, 0, 102, 0.035) 60%,
                    transparent 72%
                );

            border:
                1px dashed rgba(255, 0, 102, 0.38);

            box-shadow:
                0 0 25px rgba(255, 0, 102, 0.08),
                inset 0 0 20px rgba(255, 0, 102, 0.04);

            animation:
                fireZonePulse 1.8s ease-in-out infinite;
        }

        #fire-zone-visual::before,
        #fire-zone-visual::after {
            content: "";

            position: absolute;

            border-radius: 50%;

            pointer-events: none;
        }

        #fire-zone-visual::before {
            inset: 10px;

            border:
                1px solid rgba(255, 0, 102, 0.18);
        }

        #fire-zone-visual::after {
            inset: 24px;

            border:
                1px solid rgba(255, 0, 102, 0.12);
        }

        @keyframes fireZonePulse {
            0%,
            100% {
                opacity: 0.65;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.025);
            }
        }

        /* =========================================================
           VIRTUAL JOYSTICK
           ========================================================= */

        #virtual-joystick {
            position: absolute;

            width: 132px;
            height: 132px;

            margin: 0;

            border-radius: 50%;

            display: none;

            pointer-events: none;

            z-index: 40;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(0, 255, 204, 0.10),
                    rgba(0, 255, 204, 0.035) 60%,
                    transparent 72%
                );

            border:
                2px solid rgba(0, 255, 204, 0.48);

            box-shadow:
                0 0 20px rgba(0, 255, 204, 0.10),
                inset 0 0 25px rgba(0, 255, 204, 0.06);
        }

        #virtual-joystick::before {
            content: "";

            position: absolute;

            inset: 13px;

            border-radius: 50%;

            border:
                1px solid rgba(0, 255, 204, 0.18);
        }

        #virtual-joystick::after {
            content: "";

            position: absolute;

            left: 50%;
            top: 50%;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            background: var(--cyan);

            box-shadow:
                0 0 10px var(--cyan);
        }

        #joystick-thumb-fluid {
            position: absolute;

            left: 38.5px;
            top: 38.5px;

            width: 55px;
            height: 55px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff 0%,
                    #7ffff0 12%,
                    #00ffcc 45%,
                    #008f78 100%
                );

            border:
                2px solid rgba(255, 255, 255, 0.9);

            box-shadow:
                0 0 12px rgba(0, 255, 204, 0.9),
                0 0 28px rgba(0, 255, 204, 0.35);

            transition:
                transform 0.045s linear;
        }

        /* =========================================================
           SCREEN OVERLAYS
           ========================================================= */

        .screen {
            position: absolute;

            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding:
                25px
                max(20px, env(safe-area-inset-right))
                25px
                max(20px, env(safe-area-inset-left));

            z-index: 100;

            background:
                radial-gradient(
                    circle at center,
                    rgba(5, 18, 28, 0.88) 0%,
                    rgba(1, 5, 9, 0.97) 68%,
                    rgba(0, 0, 0, 0.99) 100%
                );

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            animation:
                screenFadeIn 0.25s ease-out;
        }

        .screen::before {
            content: "";

            position: absolute;

            inset: 12px;

            border:
                1px solid rgba(0, 255, 204, 0.08);

            pointer-events: none;
        }

        .screen::after {
            content: "";

            position: absolute;

            width: min(600px, 90vw);
            height: 250px;

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(0, 255, 204, 0.08),
                    transparent 70%
                );

            filter: blur(10px);

            pointer-events: none;
        }

        .screen > * {
            position: relative;
            z-index: 2;
        }

        @keyframes screenFadeIn {
            from {
                opacity: 0;
                transform: scale(1.015);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* =========================================================
           TITLE
           ========================================================= */

        h1 {
            margin: 0 0 12px;

            font-size: clamp(32px, 7vw, 58px);

            line-height: 1;

            font-weight: 900;

            letter-spacing:
                clamp(2px, 0.7vw, 6px);

            color: var(--pink);

            text-shadow:
                0 0 8px rgba(255, 0, 102, 0.9),
                0 0 25px rgba(255, 0, 102, 0.65),
                0 0 55px rgba(255, 0, 102, 0.3);

            animation:
                titleGlow 2.2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%,
            100% {
                text-shadow:
                    0 0 8px rgba(255, 0, 102, 0.9),
                    0 0 25px rgba(255, 0, 102, 0.65);
            }

            50% {
                text-shadow:
                    0 0 12px rgba(255, 0, 102, 1),
                    0 0 38px rgba(255, 0, 102, 0.8),
                    0 0 70px rgba(255, 0, 102, 0.35);
            }
        }

        .subtitle {
            max-width: 680px;

            margin:
                0 auto 28px;

            color: var(--cyan);

            font-size: clamp(12px, 2vw, 17px);

            line-height: 1.65;

            letter-spacing: 0.5px;

            text-shadow:
                0 0 10px rgba(0, 255, 204, 0.35);
        }

        .subtitle small {
            display: inline-block;

            margin-top: 8px;

            color: #6ee7d2;

            font-size: clamp(9px, 1.5vw, 13px);

            opacity: 0.85;
        }

        /* =========================================================
           BUTTON
           ========================================================= */

        .btn {
            position: relative;

            min-width: 190px;

            padding:
                13px 34px;

            border: 1px solid var(--cyan);

            outline: none;

            color: #00100d;

            background:
                linear-gradient(
                    135deg,
                    #00ffcc,
                    #7ffff0
                );

            font-family: "Orbitron", sans-serif;

            font-size: clamp(14px, 2.2vw, 19px);

            font-weight: 900;

            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 0 12px rgba(0, 255, 204, 0.75),
                0 0 35px rgba(0, 255, 204, 0.28);

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease,
                filter 0.12s ease;
        }

        .btn::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 2px;

            background: rgba(255, 255, 255, 0.8);

            opacity: 0.65;
        }

        .btn::after {
            content: "";

            position: absolute;

            inset: 4px;

            border:
                1px solid rgba(0, 20, 17, 0.22);

            pointer-events: none;
        }

        .btn:hover {
            filter: brightness(1.1);

            box-shadow:
                0 0 18px rgba(0, 255, 204, 0.95),
                0 0 45px rgba(0, 255, 204, 0.4);
        }

        .btn:active {
            transform: scale(0.95);

            filter: brightness(1.2);
        }

        /* =========================================================
           ROTATE NOTICE
           ========================================================= */

        #rotateNotice {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            display: none;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 25px;

            z-index: 999;

            background:
                radial-gradient(
                    circle,
                    #07131d 0%,
                    #02050a 65%,
                    #000 100%
                );
        }

        #rotateNotice h2 {
            margin: 0 0 12px;

            color: var(--pink);

            font-size: clamp(20px, 5vw, 30px);

            letter-spacing: 2px;

            text-shadow:
                0 0 15px rgba(255, 0, 102, 0.85);
        }

        #rotateNotice p {
            max-width: 420px;

            margin: 0;

            color: var(--cyan);

            font-size: clamp(12px, 2.5vw, 16px);

            line-height: 1.6;
        }

        /* =========================================================
           UTILITY
           ========================================================= */

        .hidden {
            display: none !important;
        }

        .danger {
            color: var(--pink) !important;
        }

        .victory {
            color: var(--yellow) !important;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 700px) {
            .ui-layer {
                min-height: 50px;

                padding-left: 10px;
                padding-right: 10px;

                gap: 7px;
            }

            .header-hud,
            .status-hud {
                gap: 5px;
            }

            .hud-chip {
                padding: 4px 5px;
            }

            #powerupStatus {
                display: none;
            }

            .screen {
                padding: 20px;
            }

            h1 {
                margin-bottom: 10px;
            }

            .subtitle {
                margin-bottom: 22px;
            }

            .btn {
                min-width: 165px;
                padding: 12px 26px;
            }
        }

        @media (max-height: 500px) {
            .ui-layer {
                min-height: 44px;
                padding-top: 5px;
                padding-bottom: 5px;
            }

            h1 {
                font-size: clamp(28px, 8vh, 46px);
                margin-bottom: 7px;
            }

            .subtitle {
                margin-bottom: 14px;
                line-height: 1.35;
            }

            .btn {
                padding: 9px 28px;
            }
        }

        @media (pointer: coarse) {
            .btn {
                min-height: 46px;
            }
        }

        /* =========================================================
           ACCESSIBILITY / REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

    <body>

    <!-- =========================================================
         ROTATE NOTICE
         ========================================================= -->

    <div id="rotateNotice">
        <h2>🔄 ROTATE DEVICE</h2>

        <p>
            Operation Frontline requires
            <b>Landscape</b> mode for optimal combat.
        </p>
    </div>


    <!-- =========================================================
         GAME CONTAINER
         ========================================================= -->

    <div id="game-container">

        <!-- TOP HUD -->
        <div class="ui-layer">

            <div class="header-hud">

                <span id="scoreDisplay" class="hud-chip">
                    SCORE: 0000
                </span>

                <span id="levelDisplay" class="hud-chip">
                    LVL 1-1
                </span>

            </div>


            <div class="status-hud">

                <span id="powerupStatus">
                </span>

                <span id="livesDisplay" class="hud-chip">
                    LIVES: 3 💚
                </span>

                <span id="enemiesLeft" class="hud-chip">
                    ENEMIES: 6
                </span>

            </div>

        </div>


        <!-- =====================================================
             GAME CANVAS
             ===================================================== -->

        <canvas id="gameCanvas"></canvas>


        <!-- =====================================================
             MOBILE FIRE ZONE
             ===================================================== -->

        <div id="fire-zone-visual">
            FIRE
        </div>


        <!-- =====================================================
             VIRTUAL JOYSTICK
             ===================================================== -->

        <div id="virtual-joystick">

            <div id="joystick-thumb-fluid"></div>

        </div>


        <!-- =====================================================
             START SCREEN
             ===================================================== -->

        <div id="startScreen" class="screen">

            <h1>
                CYBER TANK
            </h1>

            <p id="guideText" class="subtitle">
                Left Screen: Move Tank • Right Screen: Tap to Shoot
            </p>

            <button
                id="deployButton"
                class="btn"
                type="button"
                onclick="startGame()"
            >
                DEPLOY
            </button>

        </div>


        <!-- =====================================================
             GAME OVER SCREEN
             ===================================================== -->

        <div
            id="gameOverScreen"
            class="screen hidden"
        >

            <h1 class="danger">
                MISSION FAILED
            </h1>

            <p
                id="finalScoreText"
                class="subtitle"
            >
                YOUR TANK WAS DESTROYED
            </p>

            <button
                id="redeployButton"
                class="btn"
                type="button"
                onclick="startGame()"
            >
                RE-DEPLOY
            </button>

        </div>


        <!-- =====================================================
             VICTORY SCREEN
             ===================================================== -->

        <div
            id="victoryScreen"
            class="screen hidden"
        >

            <h1 class="victory">
                VICTORY!
            </h1>

            <p
                id="victoryScoreText"
                class="subtitle"
            >
                ENEMY BASE OBLITERATED.
            </p>

            <button
                id="playAgainButton"
                class="btn"
                type="button"
                onclick="startGame()"
            >
                PLAY AGAIN
            </button>

        </div>

    </div>


    <!-- =========================================================
         GAME JAVASCRIPT
         PART 2
         ========================================================= -->

    <script>

        "use strict";


        /* =========================================================
           CANVAS
           ========================================================= */

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d", {
                alpha: false
            });


        /* =========================================================
           DOM REFERENCES
           ========================================================= */

        const gameContainer =
            document.getElementById("game-container");

        const rotateNotice =
            document.getElementById("rotateNotice");

        const startScreen =
            document.getElementById("startScreen");

        const gameOverScreen =
            document.getElementById("gameOverScreen");

        const victoryScreen =
            document.getElementById("victoryScreen");

        const guideText =
            document.getElementById("guideText");

        const scoreDisplay =
            document.getElementById("scoreDisplay");

        const levelDisplay =
            document.getElementById("levelDisplay");

        const livesDisplay =
            document.getElementById("livesDisplay");

        const enemiesLeft =
            document.getElementById("enemiesLeft");

        const powerupStatus =
            document.getElementById("powerupStatus");

        const fireZone =
            document.getElementById("fire-zone-visual");

        const joystickEl =
            document.getElementById("virtual-joystick");

        const joystickThumb =
            document.getElementById("joystick-thumb-fluid");


        /* =========================================================
           DEVICE
           ========================================================= */

        const isTouchDevice =
            ("ontouchstart" in window) ||
            (navigator.maxTouchPoints > 0);


        /* =========================================================
           CANVAS RESIZE
           ========================================================= */

        function resizeCanvas() {

            const rect =
                gameContainer.getBoundingClientRect();

            const width =
                Math.max(320, Math.floor(rect.width));

            const height =
                Math.max(240, Math.floor(rect.height));


            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            canvas.width =
                Math.floor(width * dpr);

            canvas.height =
                Math.floor(height * dpr);


            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";


            /*
             * Semua koordinat game tetap menggunakan
             * CSS pixel, bukan pixel fisik layar.
             */

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        }


        /* =========================================================
           DEVICE / ORIENTATION
           ========================================================= */

        function checkDeviceLayout() {

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;


            const portrait =
                height > width;


            if (isTouchDevice) {

                if (portrait) {

                    rotateNotice.style.display =
                        "flex";

                    fireZone.style.display =
                        "none";

                } else {

                    rotateNotice.style.display =
                        "none";

                    fireZone.style.display =
                        "flex";

                    guideText.innerHTML =
                        "Left Screen: Move Tank • " +
                        "Right Screen: Tap anywhere to Shoot";
                }

            } else {

                rotateNotice.style.display =
                    "none";

                fireZone.style.display =
                    "none";

                guideText.innerHTML =
                    "Infiltrate Open-Field Combat • " +
                    "Collect Power-ups • " +
                    "Destroy Level 5 Base" +
                    "<br>" +
                    "<span style='color:#00ffcc; font-size:13px;'>" +
                    "Move: WASD / Arrow Keys &nbsp; | &nbsp; " +
                    "Shoot: Spacebar" +
                    "</span>";
            }


            resizeCanvas();
        }


        window.addEventListener(
            "resize",
            checkDeviceLayout,
            { passive: true }
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    checkDeviceLayout,
                    100
                );

            },
            { passive: true }
        );


        checkDeviceLayout();


        /* =========================================================
           AUDIO
           ========================================================= */

        let audioCtx = null;

        let bgmInterval = null;

        let bgmStep = 0;


        function initAudio() {

            try {

                if (!audioCtx) {

                    const AudioContext =
                        window.AudioContext ||
                        window.webkitAudioContext;

                    if (!AudioContext) {
                        return;
                    }

                    audioCtx =
                        new AudioContext();
                }


                if (
                    audioCtx.state ===
                    "suspended"
                ) {

                    audioCtx.resume()
                        .catch(() => {});
                }


                startBGM();

            } catch (error) {

                console.warn(
                    "Audio initialization failed:",
                    error
                );
            }
        }


        function startBGM() {

            if (bgmInterval) {
                return;
            }


            const bassNotes = [
                98.00,
                110.00,
                123.47,
                146.83,
                123.47,
                110.00
            ];


            bgmInterval =
                setInterval(() => {

                    if (
                        !isPlaying ||
                        !audioCtx
                    ) {
                        return;
                    }


                    try {

                        const osc =
                            audioCtx.createOscillator();

                        const gain =
                            audioCtx.createGain();

                        const filter =
                            audioCtx.createBiquadFilter();


                        const now =
                            audioCtx.currentTime;


                        osc.type =
                            "sawtooth";


                        osc.frequency.setValueAtTime(
                            bassNotes[
                                bgmStep %
                                bassNotes.length
                            ],
                            now
                        );


                        filter.type =
                            "lowpass";

                        filter.frequency.setValueAtTime(
                            850,
                            now
                        );


                        gain.gain.setValueAtTime(
                            0.025,
                            now
                        );


                        gain.gain.exponentialRampToValueAtTime(
                            0.001,
                            now + 0.22
                        );


                        osc.connect(filter);

                        filter.connect(gain);

                        gain.connect(
                            audioCtx.destination
                        );


                        osc.start(now);

                        osc.stop(
                            now + 0.23
                        );


                        bgmStep++;

                    } catch (error) {

                        // Audio errors should never
                        // stop the game loop.
                    }

                }, 240);
        }


        function stopAudio() {

            if (bgmInterval) {

                clearInterval(
                    bgmInterval
                );

                bgmInterval = null;
            }
        }


        function playSound(type) {

            if (!audioCtx) {
                return;
            }


            try {

                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();


                osc.connect(gain);

                gain.connect(
                    audioCtx.destination
                );


                const now =
                    audioCtx.currentTime;


                if (type === "shoot") {

                    osc.type =
                        "square";

                    osc.frequency.setValueAtTime(
                        520,
                        now
                    );

                    osc.frequency.exponentialRampToValueAtTime(
                        90,
                        now + 0.08
                    );

                    gain.gain.setValueAtTime(
                        0.07,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.08
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.08
                    );

                }


                else if (type === "bazooka") {

                    osc.type =
                        "sawtooth";

                    osc.frequency.setValueAtTime(
                        250,
                        now
                    );

                    osc.frequency.exponentialRampToValueAtTime(
                        40,
                        now + 0.15
                    );

                    gain.gain.setValueAtTime(
                        0.13,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.15
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.15
                    );

                }


                else if (type === "powerup") {

                    osc.type =
                        "triangle";

                    osc.frequency.setValueAtTime(
                        400,
                        now
                    );

                    osc.frequency.exponentialRampToValueAtTime(
                        1000,
                        now + 0.20
                    );

                    gain.gain.setValueAtTime(
                        0.10,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.20
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.20
                    );

                }


                else if (type === "explode") {

                    osc.type =
                        "sawtooth";

                    osc.frequency.setValueAtTime(
                        160,
                        now
                    );

                    osc.frequency.linearRampToValueAtTime(
                        20,
                        now + 0.35
                    );

                    gain.gain.setValueAtTime(
                        0.18,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.35
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.35
                    );

                }


                else if (type === "wave_clear") {

                    osc.type =
                        "sine";

                    osc.frequency.setValueAtTime(
                        300,
                        now
                    );

                    osc.frequency.exponentialRampToValueAtTime(
                        950,
                        now + 0.35
                    );

                    gain.gain.setValueAtTime(
                        0.10,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.35
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.35
                    );

                }


                else if (type === "gameover") {

                    osc.type =
                        "sawtooth";

                    osc.frequency.setValueAtTime(
                        180,
                        now
                    );

                    osc.frequency.linearRampToValueAtTime(
                        15,
                        now + 0.70
                    );

                    gain.gain.setValueAtTime(
                        0.20,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.70
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.70
                    );

                }

            } catch (error) {

                // Audio must never crash gameplay.
            }
        }

        };

        window.addEventListener(
            "keydown",

        window.addEventListener(
            "touchstart",
            (event) => {

                if (
                    !isPlaying ||
                    !isTouchDevice
                ) {

                }


                for (

                    of event.changedTouches
                ) {

                    const x =

                    const y =
                        touch.clientY;


                    /*
                     * LEFT HALF = MOVEMENT
                     */

                    if (
                        x <
                        window.innerWidth / 2
                    ) {

                        if (
                            !joystickActive
                        ) {

                            startJoystick(
                                touch
                            );
                        }

                    }


                    /*
                     * RIGHT HALF = FIRE
                     */

                    else {

                        playerFire();
                    }
                }

            },
            {
                passive: true
            }
        );


        /* =========================================================
           START JOYSTICK
           ========================================================= */

        function startJoystick(touch) {

            joystickActive = true;

            joystickPointerId =
                touch.identifier;


            joystickOrigin.x =
                touch.clientX;

            joystickOrigin.y =
                touch.clientY;


            joystickEl.style.display =
                "block";


            joystickEl.style.left =
                touch.clientX + "px";

            joystickEl.style.top =
                touch.clientY + "px";


            joystickThumb.style.transform =
                "translate(0px, 0px)";


            joystickVector.x = 0;

            joystickVector.y = 0;
        }


        /* =========================================================
           JOYSTICK MOVE
           ========================================================= */

        window.addEventListener(
            "touchmove",
            (event) => {

                if (
                    !joystickActive
                ) {
                    return;
                }


                let joystickTouch =
                    null;


                for (
                    const touch
                    of event.touches
                ) {

                    if (
                        touch.identifier ===
                        joystickPointerId
                    ) {

                        joystickTouch =
                            touch;

                        break;
                    }
                }


                if (!joystickTouch) {
                    return;
                }


                let dx =
                    joystickTouch.clientX -
                    joystickOrigin.x;

                let dy =
                    joystickTouch.clientY -
                    joystickOrigin.y;


                const distance =
                    Math.hypot(
                        dx,
                        dy
                    );


                if (
                    distance >
                    joystickMaxRadius
                ) {

                    dx =
                        (dx / distance) *
                        joystickMaxRadius;

                    dy =
                        (dy / distance) *
                        joystickMaxRadius;
                }


                joystickThumb.style.transform =
                    `translate(${dx}px, ${dy}px)`;


                joystickVector.x =
                    dx /
                    joystickMaxRadius;

                joystickVector.y =
                    dy /
                    joystickMaxRadius;

            },
            {
                passive: true
            }
        );


        /* =========================================================
           JOYSTICK END
           ========================================================= */

        window.addEventListener(
            "touchend",
            (event) => {

                if (
                    !joystickActive
                ) {
                    return;
                }


                let joystickReleased =
                    false;


                for (
                    const touch
                    of event.changedTouches
                ) {

                    if (
                        touch.identifier ===
                        joystickPointerId
                    ) {

                        joystickReleased =
                            true;

                        break;
                    }
                }


                if (
                    !joystickReleased
                ) {
                    return;
                }


                joystickActive =
                    false;

                joystickPointerId =
                    null;


                joystickVector.x = 0;

                joystickVector.y = 0;


                joystickThumb.style.transform =
                    "translate(0px, 0px)";


                joystickEl.style.display =
                    "none";

            },
            {
                passive: true
            }
        );


        window.addEventListener(
            "touchcancel",
            () => {

                joystickActive =
                    false;

                joystickPointerId =
                    null;

                joystickVector.x = 0;

                joystickVector.y = 0;

                joystickEl.style.display =
                    "none";

                joystickThumb.style.transform =
                    "translate(0px, 0px)";
            },
            {
                passive: true
            }
        );
