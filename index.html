<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Tank: Operation Frontline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Orbitron', sans-serif;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #020205;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #03050a;
        }
        
        /* UI HUD High Contrast */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            background: rgba(2, 2, 5, 0.95);
            border-bottom: 2px solid #00ffcc66;
        }
        .header-hud {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.9);
            display: flex;
            gap: 20px;
        }
        .status-hud {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            gap: 20px;
            align-items: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /* Tombol Fire High Contrast Translucent */
        .mobile-fire-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 95px;
            height: 95px;
            background: rgba(255, 0, 100, 0.3);
            border: 3px solid #ff0066;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            border-radius: 50%;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 25px rgba(255, 0, 102, 0.6);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 15;
            transition: transform 0.05s, background 0.05s;
        }
        .mobile-fire-btn:active {
            background: rgba(255, 0, 102, 0.8);
            transform: scale(0.92);
        }

        /* Floating Joystick High Contrast */
        #virtual-joystick {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(0, 255, 204, 0.08);
            border: 2px solid rgba(0, 255, 204, 0.5);
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
            z-index: 15;
        }
        #joystick-thumb-fluid {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #00ffcc;
            border: 2px solid #ffffff;
            top: 35.5px;
            left: 35.5px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 1);
        }

        /* Layar Peringatan Rotasi HP */
        #rotateNotice {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
        }
        #rotateNotice h2 {
            color: #ff0066;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255,0,102,0.9);
        }
        #rotateNotice p {
            color: #00ffcc;
            font-size: 15px;
            line-height: 1.4;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 5, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }
        h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 8px;
            color: #ff0066;
            text-shadow: 0 0 30px rgba(255, 0, 102, 0.9);
            letter-spacing: 3px;
        }
        p {
            color: #00ffcc;
            font-size: 16px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }
        .btn {
            background: #00ffcc;
            color: #000000;
            border: none;
            padding: 12px 36px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.7);
            transition: all 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #ffffff;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Layar Peringatan Rotasi HP -->
    <div id="rotateNotice">
        <h2>🔄 ROTATE DEVICE</h2>
        <p>Operation Frontline requires <b>Landscape</b> mode for optimal combat.</p>
    </div>

    <div id="game-container">
        <!-- HUD Layer -->
        <div class="ui-layer">
            <div class="header-hud">
                <span id="scoreDisplay">SCORE: 0000</span>
                <span id="levelDisplay" style="color: #00ffcc;">LVL 1-1</span>
            </div>
            <div class="status-hud">
                <span id="powerupStatus" style="color: #38bdf8; font-size:13px;"></span>
                <span id="livesDisplay">LIVES: 3 💚</span>
                <span id="enemiesLeft">ENEMIES: 6</span>
            </div>
        </div>

        <!-- Canvas Game Full Screen -->
        <canvas id="gameCanvas"></canvas>

        <!-- Floating Joystick Visual -->
        <div id="virtual-joystick">
            <div id="joystick-thumb-fluid"></div>
        </div>

        <!-- Tombol Fire Translucent -->
        <button id="mobileFireBtn" class="mobile-fire-btn">FIRE</button>

        <!-- Start Screen -->
        <div id="startScreen" class="screen">
            <h1>CYBER TANK</h1>
            <p id="guideText">Infiltrate Enemy Lines • Collect Bazooka & Shield • Destroy Level 5 Base</p>
            <button class="btn" onclick="startGame()">DEPLOY</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: #ff0066;">MISSION FAILED</h1>
            <p id="finalScoreText" style="color: #94a3b8;">YOUR TANK WAS DESTROYED</p>
            <button class="btn" onclick="startGame()">RE-DEPLOY</button>
        </div>

        <!-- Victory Screen -->
        <div id="victoryScreen" class="screen hidden">
            <h1 style="color: #facc15;">VICTORY!</h1>
            <p id="victoryScoreText" style="color: #00ffcc;">ENEMY BASE OBLITERATED.</p>
            <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        function checkDeviceLayout() {
            if (isTouchDevice) {
                if (window.innerHeight > window.innerWidth) {
                    document.getElementById('rotateNotice').style.display = 'flex';
                } else {
                    document.getElementById('rotateNotice').style.display = 'none';
                    document.getElementById('mobileFireBtn').style.display = 'flex';
                    document.getElementById('guideText').innerHTML = "Touch Left Screen to Move & Right Fire to Shoot";
                }
            } else {
                document.getElementById('rotateNotice').style.display = 'none';
                document.getElementById('mobileFireBtn').style.display = 'none';
                document.getElementById('guideText').innerHTML = "Infiltrate Enemy Lines • Collect Bazooka & Shield • Destroy Level 5 Base<br><span style='color:#00ffcc; font-size:14px;'>Move: WASD / Arrow Keys &nbsp;|&nbsp; Shoot: Spacebar</span>";
            }
            resizeCanvas();
        }

        window.addEventListener('resize', checkDeviceLayout);
        window.addEventListener('orientationchange', checkDeviceLayout);
        checkDeviceLayout();

        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startBGM();
        }

        function startBGM() {
            if (bgmInterval) return;
            const bassNotes = [98.00, 110.00, 123.47, 146.83];
            let step = 0;

            bgmInterval = setInterval(() => {
                if (!isPlaying || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(bassNotes[step % bassNotes.length], audioCtx.currentTime);

                    let filter = audioCtx.createBiquadFilter();
                    filter.type = "lowpass";
                    filter.frequency.setValueAtTime(800, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                    step++;
                } catch(e) {}
            }, 240);
        }

        function stopAudio() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === "shoot") {
                    osc.type = "square";
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === "bazooka") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === "powerup") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === "explode") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.4);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === "wave_clear") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(950, now + 0.35);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(15, now + 0.7);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                    osc.start(now);
                    osc.stop(now + 0.7);
                }
            } catch (e) {}
        }

        let isPlaying = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let wave = 1;
        let enemiesRemaining = 6;

        let player = {
            x: 0, y: 0,
            size: 36,
            speed: 4.8,
            dir: 'UP',
            activePowerup: null,
            powerupTimer: 0
        };

        let enemyBase = null;
        let bullets = [];
        let enemies = [];
        let walls = [];
        let powerups = [];
        let particles = [];
        let enemySpawnTimer = 0;

        let joystickVector = { x: 0, y: 0 };
        let joystickActive = false;
        let joystickTouchId = null;
        const joystickEl = document.getElementById('virtual-joystick');
        const thumbEl = document.getElementById('joystick-thumb-fluid');
        let joystickOrigin = { x: 0, y: 0 };

        window.addEventListener('touchstart', (e) => {
            if (!isPlaying || !isTouchDevice) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.clientX < window.innerWidth / 2 && !joystickActive) {
                    joystickActive = true;
                    joystickTouchId = touch.identifier;
                    joystickOrigin.x = touch.clientX;
                    joystickOrigin.y = touch.clientY;

                    joystickEl.style.display = 'block';
                    joystickEl.style.left = touch.clientX + 'px';
                    joystickEl.style.top = touch.clientY + 'px';
                    thumbEl.style.transform = `translate(0px, 0px)`;
                    joystickVector.x = 0;
                    joystickVector.y = 0;
                }
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    let dx = touch.clientX - joystickOrigin.x;
                    let dy = touch.clientY - joystickOrigin.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let maxRadius = 45;

                    if (distance > maxRadius) {
                        dx = (dx / distance) * maxRadius;
                        dy = (dy / distance) * maxRadius;
                    }

                    thumbEl.style.transform = `translate(${dx}px, ${dy}px)`;
                    joystickVector.x = dx / maxRadius;
                    joystickVector.y = dy / maxRadius;
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!joystickActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    joystickActive = false;
                    joystickTouchId = null;
                    joystickEl.style.display = 'none';
                    joystickVector.x = 0;
                    joystickVector.y = 0;
                }
            }
        }, { passive: true });

        document.getElementById('mobileFireBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            playerFire();
        }, { passive: false });

        let keys = {};
        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            keys[e.code] = true;
            if (e.code === 'Space') {
                playerFire();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function playerFire() {
            if (!isPlaying) return;
            let playerBullets = bullets.filter(b => b.isPlayer);
            let limit = player.activePowerup === 'bazooka' ? 2 : 3;
            if (playerBullets.length < limit) {
                let isBazooka = player.activePowerup === 'bazooka';
                playSound(isBazooka ? "bazooka" : "shoot");

                let bx = player.x + player.size / 2 - (isBazooka ? 6 : 3);
                let by = player.y + player.size / 2 - (isBazooka ? 6 : 3);
                let vx = 0, vy = 0;
                let speed = isBazooka ? 7.5 : 10;

                if (player.dir === 'UP') vy = -speed;
                else if (player.dir === 'DOWN') vy = speed;
                else if (player.dir === 'LEFT') vx = -speed;
                else if (player.dir === 'RIGHT') vx = speed;

                bullets.push({ 
                    x: bx, y: by, vx: vx, vy: vy, 
                    size: isBazooka ? 14 : 6, 
                    isPlayer: true, 
                    isBazooka: isBazooka 
                });
            }
        }

        function initLevel() {
            resizeCanvas();
            player.x = canvas.width / 2 - 50;
            player.y = canvas.height - 90;
            player.dir = 'UP';

            bullets = [];
            enemies = [];
            powerups = [];
            particles = [];
            enemyBase = null;

            enemiesRemaining = 4 + (level * 2);

            if (level === 5 && wave === 2) {
                enemyBase = {
                    x: canvas.width / 2 - 50,
                    y: 70,
                    w: 100,
                    h: 55,
                    health: 20,
                    maxHealth: 20
                };
                enemiesRemaining = 0;
            }

            walls = [];
            let cols = Math.floor(canvas.width / 60);
            let rows = Math.floor(canvas.height / 60);
            for (let r = 2; r < rows - 3; r++) {
                for (let c = 1; c < cols - 1; c++) {
                    if (Math.random() > 0.48) {
                        walls.push({ x: c * 60, y: r * 60, w: 50, h: 20 });
                    }
                }
            }
        }

        function startGame() {
            initAudio();
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            document.getElementById("victoryScreen").classList.add("hidden");
            
            score = 0;
            lives = 3;
            level = 1;
            wave = 1;
            player.activePowerup = null;
            player.powerupTimer = 0;
            isPlaying = true;
            initLevel();
            loop();
        }

        function gameOver() {
            isPlaying = false;
            stopAudio();
            playSound("gameover");
            document.getElementById("gameOverScreen").classList.remove("hidden");
        }

        function victory() {
            isPlaying = false;
            stopAudio();
            playSound("wave_clear");
            document.getElementById("victoryScreen").classList.remove("hidden");
        }

        function spawnEnemy() {
            if (enemies.length < 3 + Math.floor(level/2) && enemiesRemaining > 0) {
                let spawnX = Math.random() > 0.5 ? 50 : canvas.width - 100;
                enemies.push({
                    x: spawnX,
                    y: 70,
                    size: 36,
                    speed: 1.25 + (level * 0.1),
                    dir: 'DOWN',
                    shootTimer: 0
                });
                enemiesRemaining--;
            }
        }

        function spawnPowerup(x, y) {
            let types = ['heart', 'bazooka', 'shield'];
            let chosen = types[Math.floor(Math.random() * types.length)];
            powerups.push({ x: x, y: y, size: 28, type: chosen });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7,
                    radius: Math.random() * 4 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function update() {
            if (!isPlaying) return;

            if (player.activePowerup) {
                player.powerupTimer--;
                if (player.powerupTimer <= 0) {
                    player.activePowerup = null;
                    document.getElementById("powerupStatus").innerText = "";
                }
            }

            let nextX = player.x;
            let nextY = player.y;

            if (keys['KeyW'] || keys['ArrowUp']) {
                player.dir = 'UP'; nextY -= player.speed;
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                player.dir = 'DOWN'; nextY += player.speed;
            } else if (keys['KeyA'] || keys['ArrowLeft']) {
                player.dir = 'LEFT'; nextX -= player.speed;
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                player.dir = 'RIGHT'; nextX += player.speed;
            } 
            else if (joystickActive) {
                nextX += joystickVector.x * player.speed * 1.35;
                nextY += joystickVector.y * player.speed * 1.35;

                if (Math.abs(joystickVector.x) > Math.abs(joystickVector.y)) {
                    player.dir = joystickVector.x > 0 ? 'RIGHT' : 'LEFT';
                } else {
                    player.dir = joystickVector.y > 0 ? 'DOWN' : 'UP';
                }
            }

            if (nextX >= 20 && nextX + player.size <= canvas.width - 20 &&
                nextY >= 60 && nextY + player.size <= canvas.height - 20) {
                player.x = nextX;
                player.y = nextY;
            }

            if (!(level === 5 && wave === 2)) {
                enemySpawnTimer++;
                if (enemySpawnTimer % 65 === 0) {
                    spawnEnemy();
                }
            }

            for (let en of enemies) {
                if (Math.random() < 0.035) {
                    let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                    en.dir = dirs[Math.floor(Math.random() * dirs.length)];
                }

                let evx = 0, evy = 0;
                if (en.dir === 'UP') evy = -en.speed;
                else if (en.dir === 'DOWN') evy = en.speed;
                else if (en.dir === 'LEFT') evx = -en.speed;
                else if (en.dir === 'RIGHT') evx = en.speed;

                en.x += evx;
                en.y += evy;

                if (en.x < 20 || en.x + en.size > canvas.width - 20) en.x -= evx;
                if (en.y < 60 || en.y + en.size > canvas.height - 20) en.y -= evy;

                en.shootTimer++;
                if (en.shootTimer === 60) {
                    en.shootTimer = 0;
                    let ebx = en.x + en.size / 2 - 3;
                    let eteby = en.y + en.size / 2 - 3;
                    let bvx = 0, bvy = 0;
                    let bspeed = 5.5;
                    if (en.dir === 'UP') bvy = -bspeed;
                    else if (en.dir === 'DOWN') bvy = bspeed;
                    else if (en.dir === 'LEFT') bvx = -bspeed;
                    else if (en.dir === 'RIGHT') bvx = bspeed;

                    bullets.push({ x: ebx, y: eteby, vx: bvx, vy: bvy, size: 6, isPlayer: false });
                }
            }

            for (let p = powerups.length - 1; p >= 0; p--) {
                let pw = powerups[p];
                if (player.x < pw.x + pw.size && player.x + player.size > pw.x &&
                    player.y < pw.y + pw.size && player.y + player.size > pw.y) {
                    playSound("powerup");
                    
                    if (pw.type === 'heart') {
                        lives++;
                        document.getElementById("powerupStatus").innerText = "EXTRA LIFE +1 💚";
                    } else if (pw.type === 'bazooka') {
                        player.activePowerup = 'bazooka';
                        player.powerupTimer = 450;
                        document.getElementById("powerupStatus").innerText = "PLASMA BAZOOKA 🚀";
                    } else if (pw.type === 'shield') {
                        player.activePowerup = 'shield';
                        player.powerupTimer = 350;
                        document.getElementById("powerupStatus").innerText = "ENERGY SHIELD 🛡️";
                    }

                    powerups.splice(p, 1);
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                let hitWall = false;
                for (let w = walls.length - 1; w >= 0; w--) {
                    let wall = walls[w];
                    if (b.x < wall.x + wall.w && b.x + b.size > wall.x &&
                        b.y < wall.y + wall.h && b.y + b.size > wall.y) {
                        
                        if (!b.isBazooka) {
                            hitWall = true;
                        }
                        walls.splice(w, 1);
                        createParticles(wall.x + wall.w/2, wall.y + wall.h/2, "#ffb86c", 8);
                        break;
                    }
                }
                if (hitWall) {
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.isPlayer) {
                    if (enemyBase && b.x < enemyBase.x + enemyBase.w && b.x + b.size > enemyBase.x &&
                        b.y < enemyBase.y + enemyBase.h && b.y + b.size > enemyBase.y) {
                        
                        let dmg = b.isBazooka ? 3 : 1;
                        enemyBase.health -= dmg;
                        playSound("explode");
                        createParticles(b.x, b.y, "#ff0066", 15);
                        bullets.splice(i, 1);
                        
                        if (enemyBase.health <= 0) {
                            createParticles(enemyBase.x + enemyBase.w/2, enemyBase.y + enemyBase.h/2, "#facc15", 60);
                            victory();
                            return;
                        }
                        continue;
                    }

                    let hitEnemy = false;
                    for (let e = enemies.length - 1; e >= 0; e--) {
                        let en = enemies[e];
                        if (b.x < en.x + en.size && b.x + b.size > en.x &&
                            b.y < en.y + en.size && b.y + b.size > en.y) {
                            
                            if (Math.random() < 0.35) {
                                spawnPowerup(en.x, en.y);
                            }

                            enemies.splice(e, 1);
                            hitEnemy = true;
                            score += b.isBazooka ? 300 : 150;
                            playSound("explode");
                            createParticles(en.x + en.size/2, en.y + en.size/2, "#ff0066", 25);
                            
                            if (enemies.length === 0 && enemiesRemaining === 0) {
                                playSound("wave_clear");
                                if (wave === 1) {
                                    wave = 2;
                                    initLevel();
                                } else {
                                    if (level < 5) {
                                        level++;
                                        wave = 1;
                                        initLevel();
                                    } else {
                                        wave = 2;
                                        initLevel();
                                    }
                                }
                            }
                            break;
                        }
                    }
                    if (hitEnemy) {
                        if (!b.isBazooka) {
                            bullets.splice(i, 1);
                            continue;
                        }
                    }
                } else {
                    if (b.x < player.x + player.size && b.x + b.size > player.x &&
                        b.y < player.y + player.size && b.y + b.size > player.y) {
                        
                        bullets.splice(i, 1);

                        if (player.activePowerup === 'shield') {
                            playSound("powerup");
                            continue;
                        }

                        lives--;
                        playSound("explode");
                        createParticles(player.x + player.size/2, player.y + player.size/2, "#00ffcc", 25);
                        
                        if (lives <= 0) {
                            gameOver();
                            return;
                        } else {
                            player.x = canvas.width / 2 - 50;
                            player.y = canvas.height - 90;
                        }
                        continue;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // Render Tank Kontras Tinggi (Pemain Cyan Terang vs Musuh Merah Crimson Menyala)
        function drawTank(x, y, size, dir, color, isPlayer) {
            ctx.save();
            ctx.translate(x + size / 2, y + size / 2);

            let angle = 0;
            if (dir === 'DOWN') angle = Math.PI;
            else if (dir === 'LEFT') angle = -Math.PI / 2;
            else if (dir === 'RIGHT') angle = Math.PI / 2;
            ctx.rotate(angle);

            if (isPlayer && player.activePowerup === 'shield') {
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.85, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Bayangan
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(-size/2 + 3, -size/2 + 3, size, size);

            // Trek Roda (Hitam pekat agar kontras)
            ctx.fillStyle = "#000000";
            ctx.fillRect(-size/2, -size/2, 8, size);
            ctx.fillRect(size/2 - 8, -size/2, 8, size);
            ctx.fillStyle = "#64748b";
            ctx.fillRect(-size/2 + 2, -size/2 + 4, 4, size - 8);
            ctx.fillRect(size/2 - 6, -size/2 + 4, 4, size - 8);

            // Bodi Utama Tank
            ctx.fillStyle = color;
            ctx.fillRect(-size/2 + 8, -size/2 + 4, size - 16, size - 8);
            
            let isBazookaActive = isPlayer && player.activePowerup === 'bazooka';
            ctx.fillStyle = isBazookaActive ? "#38bdf8" : (isPlayer ? "#008066" : "#800022");
            ctx.fillRect(-size/2 + 10, -size/2 + 8, size - 20, size - 16);

            // Laras Meriam Terang
            ctx.fillStyle = isPlayer ? "#ffffff" : "#ffcc00";
            if (isBazookaActive) {
                ctx.fillRect(-5, -size/2 - 16, 10, 30);
            } else {
                ctx.fillRect(-3.5, -size/2 - 12, 7, 24);
            }
            ctx.fillStyle = "#020205";
            ctx.fillRect(-1.5, -size/2 - 12, 3, 5);

            // Kubah Turret
            ctx.fillStyle = "#020205";
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Latar Belakang Gelap Pekat dengan Garis Grid Cyan Sangat Tipis
            ctx.strokeStyle = "#0d1b2a";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            if (enemyBase) {
                ctx.fillStyle = "#7f1d1d";
                ctx.fillRect(enemyBase.x, enemyBase.y, enemyBase.w, enemyBase.h);
                ctx.strokeStyle = "#f87171";
                ctx.lineWidth = 3;
                ctx.strokeRect(enemyBase.x, enemyBase.y, enemyBase.w, enemyBase.h);

                ctx.fillStyle = "#facc15";
                ctx.fillRect(enemyBase.x + 12, enemyBase.y + 12, enemyBase.w - 24, enemyBase.h - 24);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px 'Orbitron', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("ENEMY COMMAND BASE", enemyBase.x + enemyBase.w/2, enemyBase.y - 10);

                ctx.fillStyle = "#000000";
                ctx.fillRect(enemyBase.x, enemyBase.y - 28, enemyBase.w, 8);
                ctx.fillStyle = "#ff0066";
                ctx.fillRect(enemyBase.x, enemyBase.y - 28, enemyBase.w * (enemyBase.health / enemyBase.maxHealth), 8);
            }

            for (let wall of walls) {
                ctx.fillStyle = "#f59e0b"; // Oranye Bata Terang
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeStyle = "#78350f";
                ctx.lineWidth = 2;
                ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            }

            for (let pw of powerups) {
                ctx.save();
                ctx.translate(pw.x + pw.size/2, pw.y + pw.size/2);
                ctx.fillStyle = pw.type === 'heart' ? '#22c55e' : (pw.type === 'bazooka' ? '#38bdf8' : '#eab308');
                ctx.beginPath();
                ctx.arc(0, 0, pw.size/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = "#000000";
                ctx.font = "bold 13px 'Orbitron', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                let symbol = pw.type === 'heart' ? '💚' : (pw.type === 'bazooka' ? '🚀' : '🛡️');
                ctx.fillText(symbol, 0, 1);
                ctx.restore();
            }

            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Gambar Player (Cyan Terang #00ffcc) & Musuh (Merah Crimson #ff0066)
            drawTank(player.x, player.y, player.size, player.dir, "#00ffcc", true);

            for (let en of enemies) {
                drawTank(en.x, en.y, en.size, en.dir, "#ff0066", false);
            }

            for (let b of bullets) {
                ctx.fillStyle = b.isBazooka ? "#38bdf8" : (b.isPlayer ? "#facc15" : "#ff1a40");
                ctx.beginPath();
                ctx.arc(b.x + b.size/2, b.y + b.size/2, b.size/2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Efek Scanline CRT Tipis
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            for (let sy = 0; sy < canvas.height; sy += 4) {
                ctx.fillRect(0, sy, canvas.width, 1);
            }

            document.getElementById("scoreDisplay").innerText = `SCORE: ${Math.floor(score).toString().padStart(4, '0')}`;
            if (level === 5 && wave === 2) {
                document.getElementById("levelDisplay").innerText = `FINAL BOSS`;
                document.getElementById("enemiesLeft").innerText = `HP: ${enemyBase.health}`;
            } else {
                document.getElementById("levelDisplay").innerText = `LVL ${level}-${wave}`;
                document.getElementById("enemiesLeft").innerText = `ENEMIES: ${enemiesRemaining + enemies.length}`;
            }
            document.getElementById("livesDisplay").innerText = `LIVES: ${lives} 💚`;
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
